description: Paradex is a perpetual futures decentralized exchange (perp DEX) built
  on its own Starknet appchain, offering zero-fee trading of crypto, equities, FX
  and commodity perpetuals and options. It exposes a public REST API, a WebSocket
  API described in AsyncAPI, official Python and TypeScript SDKs, and hosted MCP servers
  for AI agents.
