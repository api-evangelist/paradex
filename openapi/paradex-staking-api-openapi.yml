openapi: 3.2.0
info:
  title: Paradex Staking API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Staking across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Staking
paths:
  /staking/balance/history:
    get:
      security:
      - BearerToken: []
      description: Returns the authenticated account's staked DIME balance timeseries
      tags:
      - Staking
      summary: Get account staked-balance history
      operationId: get-staking-balance-history
      parameters:
      - description: Sampling resolution
        name: resolution
        in: query
        required: true
        schema:
          type: string
          enum:
          - alltime
          - 1h
          - 8h
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountHistoricalDataResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /staking/balance/history/global:
    get:
      description: Returns the protocol-wide total staked DIME timeseries
      tags:
      - Staking
      summary: Get global staked-balance history
      operationId: get-global-staking-balance-history
      parameters:
      - description: Sampling resolution
        name: resolution
        in: query
        required: true
        schema:
          type: string
          enum:
          - alltime
          - 1h
          - 8h
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountHistoricalDataResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /staking/config:
    get:
      description: Returns staking tiers with minimum stake amounts, fee rates, and XP multipliers
      tags:
      - Staking
      summary: Get staking configuration
      operationId: get-staking-config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.StakingConfigResponse'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /staking/history:
    get:
      security:
      - BearerToken: []
      description: Returns all staking entries for the authenticated account including active, unstaking, and unstaked
      tags:
      - Staking
      summary: List account staking history
      operationId: get-staking-history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.StakingStakeResp'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /staking/summary:
    get:
      security:
      - BearerToken: []
      description: Returns the authenticated account's total staked amount, tier, and active stake count
      tags:
      - Staking
      summary: Get account staking summary
      operationId: get-staking-summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.StakingSummaryResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    responses.StakingTierResp:
      type: object
      properties:
        fee_rates:
          description: Absolute fee rates per asset type and order category
          type: object
          additionalProperties:
            type: string
        min_staked:
          description: Minimum DIME staked to qualify for this tier
          type: string
          example: '50000'
        tier_name:
          description: Display name of the staking tier
          type: string
          example: Silver
        xp_multiplier:
          description: XP earnings multiplier for this tier
          type: string
          example: '1.3'
