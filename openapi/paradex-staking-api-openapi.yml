    responses.APIResults:
      type: object
      properties:
        results:
          description: Array of results
          type: array
          items:
            type: object
    responses.StakingConfigResponse:
      type: object
      properties:
        dime_fee_discount_pct:
          description: DIME fee payment discount percentage (e.g. "20")
          type: string
        tiers:
          description: All available staking tiers sorted by threshold
          type: array
          items:
            $ref: '#/components/schemas/responses.StakingTierResp'
    responses.ApiError:
      type: object
      properties:
        data:
          description: any additional data related to the error
          type: object
        error:
          description: unique immutable string identifier for specific error
          allOf:
          - $ref: '#/components/schemas/responses.ErrorCode'
          example: NOT_ONBOARDED
        message:
          description: detailed description of error and how to address it
          type: string
          example: User has never called /onboarding endpoint
    responses.StakingSummaryResponse:
      type: object
      properties:
        account:
          description: Account address
          type: string
          example: '0x1234abcd'
        active_stakes:
          description: Number of active stake entries
          type: integer
          example: 2
        staking_tier:
          description: Current staking tier name
          type: string
          example: Silver
        total_staked:
          description: Total active staked DIME
          type: string
          example: '50000'
    responses.StakingStakeResp:
      type: object
      properties:
        account:
          description: Owner account address
          type: string
          example: '0x1234abcd'
        amount:
          description: Staked DIME amount
          type: string
          example: '50000'
        created_at:
          description: Server timestamp (nanoseconds since epoch)
          type: integer
          example: 1640995200000000000
        last_updated_at:
          description: Last update timestamp (nanoseconds since epoch)
          type: integer
          example: 1640995200000000000
        lock_duration:
          description: Lock duration in seconds chosen at stake time
          type: integer
          example: 2592000
        stake_id:
          description: On-chain stake ID (Pedersen hash)
          type: string
          example: '0xabc123'
        stake_txn_hash:
          description: Transaction hash of the original stake
          type: string
          example: 0xtxn123
        staked_at:
          description: Block timestamp when staked (nanoseconds since epoch)
          type: integer
          example: 1640995200000000000
        unstake_req_txn_hash:
          description: Transaction hash of the unstake request
          type: string
          example: ''
        unstake_requested_at:
          description: Block timestamp when unstake requested; 0 if not requested
          type: integer
          example: 0
        unstake_txn_hash:
          description: Transaction hash of the unstake completion
          type: string
          example: ''
        unstaked_at:
          description: Block timestamp when unstaked; 0 if still active
          type: integer
          example: 0
    responses.AccountHistoricalDataResp:
      type: object
      properties:
        data:
          description: Ordered list of datapoints
          type: array
          items:
            type: number
        timestamps:
          description: Ordered list of timestamps
          type: array
          items:
