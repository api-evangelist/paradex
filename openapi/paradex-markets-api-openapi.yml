openapi: 3.2.0
info:
  title: Paradex Markets API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Markets across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Markets
paths:
  /bbo/{market}:
    get:
      description: Get the best bid/ask for the given market
      tags:
      - Markets
      summary: Get market bbo
      operationId: get-bbo
      parameters:
      - description: 'Market symbol - ex: BTC-USD-PERP'
        name: market
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BBOResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /bbo/{market}/interactive:
    get:
      description: Returns best bid/offer including all orders including RPI (as seen by the UI)
      tags:
      - Markets
      summary: Get market bbo including all orders including RPI (as seen by the UI)
      operationId: get-bbo-interactive
      parameters:
      - description: 'Market symbol - ex: BTC-USD-PERP'
        name: market
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BBOResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /funding/data:
    get:
      description: List historical funding data by market
      tags:
      - Markets
      summary: Funding data history
      operationId: get-funding-data
      parameters:
      - description: Returns the ‘next’ paginated page.
        name: cursor
        in: query
        schema:
          type: string
      - description: End Time (unix time millisecond)
        name: end_at
        in: query
        schema:
          type: integer
      - example: BTC-USD-PERP
        description: Market for which funding payments are queried
        name: market
        in: query
        required: true
        schema:
          type: string
      - description: Limit the number of responses in the page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - description: Start Time (unix time millisecond)
        name: start_at
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.FundingDataResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /markets:
    get:
      description: Get markets static data component
      tags:
      - Markets
      summary: List available markets
      operationId: get-markets
      parameters:
      - description: 'Market Name - example: BTC-USD-PERP'
        name: market
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.MarketResp'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /markets/history:
    get:
      description: 'Returns audit-driven events for market spec changes (listing, settlement, parameter updates) over the last 7 days. Source: market audit table; includes Ops manual changes.'
      tags:
      - Markets
      summary: History of changes to market specifications
      operationId: get-markets-history
      parameters:
      - example: BTC-USD-PERP
        description: Market symbol to filter history. Omit or pass "ALL" for all markets.
        name: market
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MarketHistoryResponse'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /markets/klines:
    get:
      description: Klines for a symbol
      tags:
      - Markets
      summary: OHLCV for a symbol
      operationId: markets-klines
      parameters:
      - description: end time for klines in milliseconds
        name: end_at
        in: query
        required: true
        schema:
          type: integer
      - x-enum-varnames:
        - PriceKindLast
        - PriceKindMark
        - PriceKindUnderlying
        description: Which price to use for the klines
        name: price_kind
        in: query
        schema:
          type: string
          enum:
          - last
          - mark
          - underlying
      - description: 'resolution in minutes: 1, 3, 5, 15, 30, 60'
        name: resolution
        in: query
        required: true
        schema:
          type: string
      - description: start time for klines in milliseconds
        name: start_at
        in: query
        required: true
        schema:
          type: integer
      - description: Symbol of the market pair
        name: symbol
        in: query
        required: true
        schema:
          type: string
      responses:
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /markets/settlement-price:
    get:
      description: Returns the settlement price and the underlying spot TWAP used to compute it. The market must have already settled; otherwise returns 404.
      tags:
      - Markets
      summary: Settlement price for a single market
      operationId: get-market-settlement-price
      parameters:
      - description: Market symbol, e.g. BTC-USD-15SEP25-55000-C
        name: market
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.MarketSettlementResp'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /markets/summary:
    get:
      description: Get markets dynamic data component
      tags:
      - Markets
      summary: List available markets summary
      operationId: get-markets-summary
      parameters:
      - description: End Time (unix time millisecond)
        name: end
        in: query
        schema:
          type: integer
      - example: BTC-USD-PERP
        description: Name of the market for which summary is requested (for all available markets use ALL)
        name: market
        in: query
        required: true
        schema:
          type: string
      - description: Start Time (unix time millisecond)
        name: start
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.MarketSummaryResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /orderbook/{market}:
    get:
      description: Get snapshot of the orderbook for the given market
      tags:
      - Markets
      summary: Get market orderbook
      operationId: get-orderbook
      parameters:
      - description: 'Market symbol - ex: BTC-USD-PERP'
        name: market
        in: path
        required: true
        schema:
          type: string
      - description: Depth
        name: depth
        in: query
        schema:
          type: integer
          default: 20
      - description: Price tick for aggregation
        name: price_tick
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AskBidArray'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /orderbook/{market}/impact-price:
    get:
      tags:
      - Markets
      summary: Get market impact price
      operationId: get-impact-price
      parameters:
      - description: 'Market symbol - ex: BTC-USD-PERP'
        name: market
        in: path
        required: true
        schema:
          type: string
      - description: Size
        name: size
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ImpactPriceResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /orderbook/{market}/interactive:
    get:
      description: Returns orderbook including RPI
      tags:
      - Markets
      summary: Get market interactive orderbook
      operationId: get-orderbook-interactive
      parameters:
      - description: 'Market symbol - ex: BTC-USD-PERP'
        name: market
        in: path
        required: true
        schema:
          type: string
      - description: Depth
        name: depth
        in: query
        schema:
          type: integer
          default: 20
      - description: Price tick for aggregation
        name: price_tick
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AskBidArray'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    responses.AssetKind:
      type: string
      enum:
      - PERP
      - PERP_OPTION
      - SPOT
      - OPTION
      - FUTURE
      x-enum-varnames:
      - AssetKindPerp
      - AssetKindPerpOption
      - AssetKindSpot
      - AssetKindOption
      - AssetKindFuture
    responses.MarketKind:
      type: string
      enum:
      - ''
      - cross
      - isolated
      - isolated_margin
      x-enum-varnames:
      - MarketKindUnknown
      - MarketKindCross
      - MarketKindIsolated
      - MarketKindIsolatedMargin
    responses.OptionMarginParams:
      type: object
      properties:
        long_itm:
          description: Margin fraction for long ITM options
          type: string
          example: '0.2'
        premium_multiplier:
          description: Multiplier for margin fraction for premium
          type: string
          example: '1.2'
        short_itm:
          description: Margin fraction for short ITM options
          type: string
          example: '0.4'
        short_otm:
          description: Margin fraction for short OTM options
          type: string
          example: '0.25'
        short_put_cap:
          description: Cap for margin fraction for short put options
          type: string
          example: '0.5'
    responses.MarketSummaryResp:
      type: object
      properties:
        ask:
          description: Best ask price
          type: string
          example: '30130.15'
        ask_iv:
          description: Ask implied volatility, for options
          type: string
          example: '0.2'
        ask_size:
          description: Size at best ask price
          type: string
          example: '0.05'
        bid:
          description: Best bid price
          type: string
          example: '30112.22'
        bid_iv:
          description: Bid implied volatility, for options
          type: string
          example: '0.2'
        bid_size:
          description: Size at best bid price
          type: string
          example: '0.04'
        created_at:
          description: Market summary creation time
          type: integer
        delta:
          description: 'Deprecated: Use greeks.delta instead'
          type: string
          example: '1'
        external_fair_price:
          description: 'External fair price, calculated from spot price and an external basis: spot_price * (1 + external_basis). where external basis is the median basis rate on different external exchanges'
          type: string
          example: '29876.3'
        forward_rate:
          description: EWMA-smoothed annualized forward rate for dated options
          type: string
          example: '0.05'
        funding_rate:
          description: This raw funding rate corresponds to the actual funding period of the instrument itself. It is not a normalized 8h funding rate.
          type: string
          example: '0.3'
        future_funding_rate:
          description: For options it's a smoothed version of future's funding rate
          type: string
          example: '0.3'
        greeks:
          description: Greeks (delta, gamma, vega). Partial for perpetual futures.
          allOf:
          - $ref: '#/components/schemas/responses.Greeks'
        last_iv:
          description: Last traded price implied volatility, for options
          type: string
          example: '0.2'
        last_traded_price:
          description: Last traded price
          type: string
          example: '30109.53'
        mark_iv:
          description: Mark implied volatility, for options
          type: string
          example: '0.2'
        mark_price:
          description: '[Mark price](https://docs.paradex.trade/risk-system/mark-price-calculation)'
          type: string
          example: '29799.70877478'
        open_interest:
          description: Open interest in base currency
          type: string
          example: '6100048.3'
        price_change_rate_24h:
          description: Price change rate in the last 24 hours
          type: string
          example: '0.05'
        risk_free_rate:
          description: Risk-free discounting rate used for option pricing
          type: string
          example: '0.05'
        rolling_details:
          description: Rolling futures details — only populated for rolling futures markets
          allOf:
          - $ref: '#/components/schemas/responses.RollingDetailsResp'
        settlement_twap_estimate:
          description: Running average of the underlying over the settlement window, on the live summary only while inside that window
          type: string
          example: '76423.56'
        symbol:
          description: Market symbol
          type: string
          example: BTC-USD-PERP
        total_volume:
          description: Lifetime total traded volume in USD
          type: string
          example: '141341.0424'
        underlying_price:
          description: Underlying asset price (spot price)
          type: string
          example: '29876.3'
        volume_24h:
          description: 24 hour volume in USD
          type: string
          example: '47041.0424'
    responses.Delta1CrossMarginParams:
      type: object
      properties:
        imf_base:
          description: Initial Margin Base
          type: string
          example: '0.11'
        imf_factor:
          description: Initial Margin Factor, always 0.
          type: string
          example: '0'
        imf_shift:
          description: Initial Margin Shift, unused, always 0.
          type: string
          example: '0'
        mmf_factor:
          description: Maintenance Margin Factor
          type: string
          example: '0.51'
    responses.FeeWithCap:
      type: object
      properties:
        fee:
          description: fee rate
          type: string
          example: '0.0003'
        fee_cap:
          description: fee cap (used for option)
          type: string
          example: '0.5'
        fee_floor:
          description: fee floor (used for option)
          type: string
          example: '-0.5'
    responses.MarketEvent:
      type: object
      properties:
        changed_fields:
          $ref: '#/components/schemas/responses.MarketHistoryFields'
        event_type:
          description: Type of change
          enum:
          - CREATED
          - DELETED
          - SETTLED
          - UPDATED
          allOf:
          - $ref: '#/components/schemas/responses.MarketEventType'
          example: UPDATED
        symbol:
          description: Market symbol
          type: string
          example: BTC-USD-PERP
        updated_at:
          description: Time of change (unix time millisecond)
          type: integer
          example: 1762809600000
    responses.MakerTakerFee:
      type: object
      properties:
        maker_fee:
          description: fee for maker
          allOf:
          - $ref: '#/components/schemas/responses.FeeWithCap'
        taker_fee:
          description: fee for taker
          allOf:
          - $ref: '#/components/schemas/responses.FeeWithCap'
    responses.PaginatedAPIResults:
      type: object
      properties:
        next:
          description: The pointer to fetch next set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiMsIm1hcmtlciI6eyJtYXJrZXIiOiIxNjc1NjUwMDE3NDMxMTAxNjk5N=
        prev:
          description: The pointer to fetch previous set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiOnsiTGltaXQiOjkwfSwidGltZSI6MTY4MTY3OTgzNzk3MTMwOTk1MywibWFya2VyIjp7Im1zMjExMD==
        results:
          description: Array of paginated results
          type: array
          items:
            type: object
    responses.ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - BINDING_ERROR
      - INTERNAL_ERROR
      - NOT_FOUND
      - SERVICE_UNAVAILABLE
      - INVALID_REQUEST_PARAMETER
      - ORDER_ID_NOT_FOUND
      - ORDER_IS_CLOSED
      - ORDER_IS_NOT_OPEN
      - INVALID_ORDER_SIZE
      - CLIENT_ORDER_ID_NOT_FOUND
      - DUPLICATED_CLIENT_ID
      - INVALID_SYMBOL
      - INVALID_TOKEN
      - INVALID_ETHEREUM_ADDRESS
      - INVALID_ETHEREUM_SIGNATURE
      - INVALID_STARKNET_ADDRESS
      - INVALID_STARKNET_SIGNATURE
      - STARKNET_SIGNATURE_VERIFICATION_FAILED
      - ETHEREUM_SIGNER_MISMATCH
      - ETHEREUM_HASH_MISMATCH
      - NOT_ONBOARDED
      - INVALID_TIMESTAMP
      - INVALID_BLOCK_EXPIRATION
      - ACCOUNT_NOT_FOUND
      - MEDIA_NOT_FOUND
      - INVALID_ORDER_SIGNATURE
      - PUBLIC_KEY_INVALID
      - UNAUTHORIZED_ETHEREUM_ADDRESS
      - UNAUTHORIZED_ERROR
      - ETHEREUM_ADDRESS_ALREADY_ONBOARDED
      - EVM_ADDRESS_ALREADY_ONBOARDED
      - MARKET_NOT_FOUND
      - ALLOWLIST_ENTRY_NOT_FOUND
      - USERNAME_IN_USE
      - GEO_IP_BLOCK
      - ETHEREUM_ADDRESS_BLOCKED
      - PROGRAM_NOT_FOUND
      - PROGRAM_NOT_SUPPORTED
      - INVALID_DASHBOARD
      - MARKET_NOT_OPEN
      - MARKET_NOT_SETTLED
      - INVALID_REFERRAL_CODE
      - REQUEST_NOT_ALLOWED
      - PARENT_ADDRESS_ALREADY_ONBOARDED
      - INVALID_PARENT_ACCOUNT
      - INVALID_VAULT_OPERATOR_CHAIN
      - VAULT_OPERATOR_ALREADY_ONBOARDED
      - VAULT_NAME_IN_USE
      - VAULT_NOT_FOUND
      - VAULT_STRATEGY_NOT_FOUND
      - VAULT_LIMIT_REACHED
      - VAULT_DATA_PRIVATE
      - BATCH_SIZE_OUT_OF_RANGE
      - ISOLATED_MARKET_ACCOUNT_MISMATCH
      - NO_ACCESS_TO_MARKET
      - POINTS_SUMMARY_NOT_FOUND
      - ALGO_ID_NOT_FOUND
      - INVALID_DERIVATION_PATH
      - PROFILE_STATS_NOT_FOUND
      - INVALID_CHAIN
      - INVALID_LAYERSWAP_SWAP
      - INVALID_DEPOSIT_ADDRESS
      - SOCIAL_USERNAME_IN_USE
      - INVALID_OAUTH_REQUEST
      - RPI_ACCOUNT_NOT_WHITELISTED
      - SYSTEM_STATUS_POST_ONLY
      - SYSTEM_STATUS_CANCEL_ONLY
      - INVALID_MARKETING_CODE
      - OFFER_NOT_FOUND
      - MARKET_MARGIN_RESTRICTED
      - NOT_UNIQUE
      - ACCOUNT_ALREADY_REFERRED
      - ONBOARDING_PERIOD_EXPIRED
      - ONBOARDING_RATE_LIMITED
      - RFQ_CREATE_BUDGET_EXCEEDED
      - SUBACCOUNTS_LIMIT_EXCEEDED
      - INSUFFICIENT_MIN_CHAIN_BALANCE
      - INSUFFICIENT_EVM_BALANCE
      - PORTFOLIO_MARGIN_ONBOARDING_DISABLED
      - PORTFOLIO_MARGIN_INVALID_ACCOUNT_KIND
      - EVM_VAULT_OPERATORS_DISABLED
