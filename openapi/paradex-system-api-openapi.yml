openapi: 3.2.0
info:
  title: Paradex System API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged System across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: System
paths:
  /system/announcements:
    get:
      description: get announcements
      tags:
      - System
      summary: Get all announcements
      operationId: get-announcements
      parameters:
      - description: Returns the ‘next’ paginated page.
        name: cursor
        in: query
        schema:
          type: string
      - description: End Time (unix time millisecond)
        name: end_at
        in: query
        schema:
          type: integer
      - description: Limit the number of responses in the page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - description: Start Time (unix time millisecond)
        name: start_at
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.Announcement'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /system/config:
    get:
      description: Get clearing and settlement layer config for Paradex
      tags:
      - System
      summary: Get system config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.SystemConfigResponse'
      operationId: getSystemConfig
      x-operation-id-source: derived
    servers:
    - url: https://api.prod.paradex.trade/v1
  /system/margin-config:
    get:
      description: 'Returns margin configuration per base asset: the portfolio

        margin risk parameters where the asset has them, and the bound

        an unpriced RFQ on it is held at.'
      tags:
      - System
      summary: Get margin configuration
      operationId: get-margin-config
      parameters:
      - description: Base asset filter (e.g. BTC, ETH). Omit to return all.
        name: base_asset
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.MarginParamsResp'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /system/portfolio-margin-config:
    get:
      description: 'Deprecated. Serves only the portfolio-margin-eligible assets,

        the rows this path has always returned. Use

        `/system/margin-config` for every listed asset and its RFQ

        bound.'
      tags:
      - System
      summary: Get portfolio margin configuration (deprecated)
      operationId: get-portfolio-margin-config
      deprecated: true
      parameters:
      - description: Base asset filter (e.g. BTC, ETH). Omit to return all.
        name: base_asset
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.MarginParamsResp'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /system/state:
    get:
      description: 'Get the current state of the Paradex system


        ## Response


        ```json

        {"status": "ok"}

        ```


        ### Status Values


        - `ok`: Fully operational

        - `maintenance`: Trading unavailable

        - `cancel_only`: Only cancellations allowed


        Check before trading operations.'
      tags:
      - System
      summary: Get system state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.SystemStateResponse'
      operationId: getSystemState
      x-operation-id-source: derived
    servers:
    - url: https://api.prod.paradex.trade/v1
  /system/time:
    get:
      description: Get the current time in the Paradex
      tags:
      - System
      summary: Get system time (unix milliseconds)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.SystemTimeResponse'
      operationId: getSystemTime
      x-operation-id-source: derived
    servers:
    - url: https://api.prod.paradex.trade/v1
  /system/volume-tiers:
    get:
      description: Returns all volume tier configurations for retail and pro profiles
      tags:
      - System
      summary: Get volume-based fee tiers
      operationId: get-volume-tiers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.VolumeTierResp'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    responses.BridgedToken:
      type: object
      properties:
        decimals:
          type: integer
        l1_bridge_address:
          type: string
        l1_token_address:
          type: string
        l2_bridge_address:
          type: string
        l2_token_address:
          type: string
        name:
          type: string
        symbol:
          type: string
    responses.AnnouncementKind:
      type: string
      enum:
      - UPDATE
      - LISTING
      - DELISTING
      x-enum-varnames:
      - AnnouncementKindUpdate
      - AnnouncementKindListing
      - AnnouncementKindDelisting
    responses.VolShockParamsResp:
      type: object
      properties:
        dte_floor_days:
          type: number
          example: 1
        min_vol_shock_up:
          type: number
          example: 0.4
        vega_power_long_dte:
          type: number
          example: 0.13
        vega_power_short_dte:
          type: number
          example: 0.3
    responses.SystemConfigResponse:
      type: object
      properties:
        assets_limit_per_account:
          description: Maximum number of token or synthetic positions allowed per account
          type: integer
          example: 550
        block_explorer_url:
          description: Block explorer URL for the current SN Instance
          type: string
          example: https://voyager.testnet.paradex.trade/
        bridged_tokens:
          description: 'bridged tokens config

            https://github.com/starknet-io/starknet-addresses/blob/master/bridged_tokens/goerli.json'
          type: array
          items:
            $ref: '#/components/schemas/responses.BridgedToken'
        dime_staking_contract_address:
          description: DIME Staking contract address
          type: string
        environment:
          description: Environment of the Paradex Instance
          type: string
          example: local
        l1_chain_id:
          description: L1 chain ID value
          type: string
          example: '5'
        l1_core_contract_address:
          description: Address of Starknet L1 core contract
          type: string
          example: '0x182FE62c57461d4c5Ab1aE6F04f1D51aA1607daf'
        l1_operator_address:
          description: Address of Starknet L1 operator
          type: string
          example: '0x63e762538C70442758Fd622116d817761c94FD6A'
        l1_relayer_address:
          description: Address of L1 Relayer
          type: string
          example: '0x63e762538C70442758Fd622116d817761c94FD6A'
        l2_relayer_address:
          description: Address of L2 Relayer
          type: string
          example: '0x63e762538C70442758Fd622116d817761c94FD6A'
        liquidation_fee:
          description: Liquidation fee
          type: string
          example: '0.20'
        oracle_address:
          description: Oracle contract address
          type: string
          example: '0x47c622ce5f7ff7fa17725df596f4f506364e49be0621eb142a75b44ee3689c6'
        paraclear_account_hash:
          description: Class hash of the account contract
          type: string
          example: '0x033434ad846cdd5f23eb73ff09fe6fddd568284a0fb7d1be20ee482f044dabe2'
        paraclear_account_proxy_hash:
          description: Proxy hash of the account contract
          type: string
          example: '0x3530cc4759d78042f1b543bf797f5f3d647cde0388c33734cf91b7f7b9314a9'
        paraclear_address:
          description: Paraclear contract address
          type: string
          example: '0x4638e3041366aa71720be63e32e53e1223316c7f0d56f7aa617542ed1e7554d'
        paraclear_decimals:
          type: integer
        paraclear_evm_account_hash:
          description: Class hash of the EVM (secp256k1) account contract
          type: string
        partial_liquidation_buffer:
          description: Partial liquidation buffer. Account value is supposed to be at least this much above the MMR after partial liquidation
          type: string
          example: '0.2'
        partial_liquidation_share_increment:
          description: Minimum granularity of partial liquidation share. The share is rounded up to the nearest multiple of this value
          type: string
          example: '0.05'
        rfq_default_max_slippage:
          description: 'The exchange-wide fallback bound an unpriced RFQ''s margin is computed

            from, as a fraction of the underlying spot notional, for an asset that

            carries no bound of its own. Per-asset bounds are on

            /system/margin-config, already resolved. It does not bound the

            execution: a quote wider than it is executable, and is charged what it

            actually costs. The price bands are what bound the trade.'
          type: string
          example: '0.0005'
        starknet_chain_id:
          description: Chain ID for the Starknet Instance
          type: string
          example: SN_CHAIN_ID
        starknet_fullnode_rpc_base_url:
          description: Full node RPC Proxy base URL for Starknet
          type: string
          example: https://rpc.api.testnet.paradex.trade
        starknet_fullnode_rpc_url:
          description: Full node RPC Proxy URL for Starknet
          type: string
          example: https://rpc.api.testnet.paradex.trade/rpc/v0_10
        starknet_gateway_url:
          description: This field is deprecated
          type: string
        universal_deployer_address:
          description: Universal deployer address
          type: string
          example: '0x1f3f9d3f1f0b7f3f9f3f9f3f9f3f9f3f9f3f9f3f'
    responses.MarginParamsResp:
      type: object
      properties:
        base_asset:
          type: string
          example: BTC
        funding_provision_hour:
          type: number
          example: 8
        hedged_margin_factor:
          type: number
          example: 0.01
        mmf_factor:
          type: number
          example: 0.5
        rfq_max_slippage:
          description: 'What the margin held against an unpriced RFQ on this asset is computed

            from, as a fraction of underlying spot notional, already resolved

            against the exchange default. It does not bound the execution.'
          type: string
          example: '0.0005'
        scenarios:
          type: array
          items:
            $ref: '#/components/schemas/responses.PortfolioMarginScenarioResp'
        unhedged_margin_factor:
          type: number
          example: 0.02
        vol_shock_params:
          $ref: '#/components/schemas/responses.VolShockParamsResp'
    responses.SystemStateResponse:
      type: object
      properties:
        status:
          description: Status of the system
          allOf:
          - $ref: '#/components/schemas/responses.SystemStatus'
          example: ok
    responses.VolumeTierResp:
      type: object
      properties:
        fee_rates:
          type: object
          additionalProperties:
            type: string
        kind:
          type: string
          example: retail
        min_volume:
          type: string
          example: '100000'
        min_volume_duration:
          type: string
          example: 14d
        nft_min_volume:
          type: string
          example: '0'
        sort_order:
          type: integer
          example: 1
        tier_name:
          type: string
          example: VIP 1
    responses.PaginatedAPIResults:
      type: object
      properties:
        next:
          description: The pointer to fetch next set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiMsIm1hcmtlciI6eyJtYXJrZXIiOiIxNjc1NjUwMDE3NDMxMTAxNjk5N=
        prev:
          description: The pointer to fetch previous set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiOnsiTGltaXQiOjkwfSwidGltZSI6MTY4MTY3OTgzNzk3MTMwOTk1MywibWFya2VyIjp7Im1zMjExMD==
        results:
          description: Array of paginated results
          type: array
          items:
            type: object
    responses.ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - BINDING_ERROR
      - INTERNAL_ERROR
      - NOT_FOUND
