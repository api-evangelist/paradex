openapi: 3.2.0
info:
  title: Paradex Account API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Account across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Account
paths:
  /account:
    get:
      security:
      - BearerToken: []
      description: Respond with requester's account information
      tags:
      - Account
      summary: Get account information
      operationId: get-account
      parameters:
      - description: Subaccount address
        name: subaccount_address
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountSummaryResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/compliance:
    get:
      security:
      - BearerToken: []
      description: Returns all compliance actions for the authenticated account
      tags:
      - Account
      summary: Get compliance actions
      operationId: get-compliance-actions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.ComplianceActionResp'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: Records a compliance action (e.g. TOS acceptance) for the authenticated account
      tags:
      - Account
      summary: Record a compliance action
      operationId: record-compliance-action
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.RecordComplianceActionRequest'
        description: Compliance action request
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Requires the account's main key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/history:
    get:
      security:
      - BearerToken: []
      description: Respond with requester's account information
      tags:
      - Account
      summary: Get account history
      operationId: get-account-history
      parameters:
      - description: Type of data
        name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - pnl
          - value
          - volume
          - fee_savings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountHistoricalDataResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/info:
    get:
      security:
      - BearerToken: []
      tags:
      - Account
      summary: Return account info of current account
      operationId: get-accounts-info
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetAccountsInfoResponse'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/margin:
    get:
      security:
      - BearerToken: []
      description: Get margin configuration for an account and market
      tags:
      - Account
      summary: Get account margin configuration
      operationId: get-account-margin
      parameters:
      - description: 'Market Name - example: BTC-USD-PERP'
        name: market
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetAccountMarginConfigsResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/margin/{market}:
    post:
      security:
      - BearerToken: []
      description: Set margin configuration for an account and market
      tags:
      - Account
      summary: Set margin configuration
      operationId: upsert-account-margin
      parameters:
      - description: 'Market Name - example: BTC-USD-PERP'
        name: market
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.AccountMarginRequest'
        description: Margin Configuration
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.UpdateAccountMarginConfigResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/profile:
    get:
      security:
      - BearerToken: []
      description: Respond with requester's account information
      tags:
      - Account
      summary: Get account profile information
      operationId: get-account-profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    put:
      security:
      - BearerToken: []
      description: Updates account profile information
      tags:
      - Account
      summary: Updates account profile
      operationId: update-account-profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.UpdateAccountProfileRequest'
        description: Update account profile request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Requires the account's main key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/profile/market_max_slippage/{market}:
    post:
      security:
      - BearerToken: []
      description: Respond with requester's account max_slippage
      tags:
      - Account
      summary: Updates account max slippage for a specific market
      operationId: update-account-market-max-slippage
      parameters:
      - description: '{base_currency}-{quote_currency}-{kind}'
        name: market
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.UpdateAccountMaxSlippageRequest'
        description: Update market max slippage request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/profile/notifications:
    post:
      security:
      - BearerToken: []
      description: Updates user notification preferences for orders, fills, announcements, and transfers. All fields are optional - only provided fields will be updated.
      tags:
      - Account
      summary: Updates account notification preferences
      operationId: update-account-notification-preferences
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.UpdateNotificationPreferencesRequest'
        description: Update notification preferences request (all fields optional)
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/profile/notifications/last_seen:
    post:
      security:
      - BearerToken: []
      description: Records current server time as the notification dedup watermark for cross-device dedup.
      tags:
      - Account
      summary: Updates the last-seen notification timestamp
      operationId: update-last-seen
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/profile/referral_code:
    post:
      security:
      - BearerToken: []
      description: Respond with requester's account information
      tags:
      - Account
      summary: Updates account profile fields
      operationId: update-account-profile-referral-code
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Requires the account's main key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/profile/refresh_inventory:
    post:
      security:
      - BearerToken: []
      description: Refreshes and returns the inventory for the authenticated account's Ethereum address
      tags:
      - Account
      summary: Refresh inventory for authenticated account
      operationId: refresh-account-inventory
      responses:
        '200':
          description: Inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RefreshInventoryResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/profile/size_currency_display:
    post:
      security:
      - BearerToken: []
      description: To set user preferences for the size currency display on the UI, BASE will use base currency, and QUOTE will use quote currency.
      tags:
      - Account
      summary: Updates account size currency display preference
      operationId: update-account-size-currency-display
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.UpdateSizeCurrencyDisplayRequest'
        description: Update account size currency display request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '400':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/profile/username:
    post:
      security:
      - BearerToken: []
      description: Respond with requester's account information
      tags:
      - Account
      summary: Updates account profile username fields
      operationId: update-account-profile-username
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Requires the account's main key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/referrer:
    post:
      security:
      - BearerToken: []
      description: Add missing account referrer within a certain time window after account creation.
      tags:
      - Account
      summary: Updates account referred_by field
      operationId: update-account-referrer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Requires the account's main key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/settings:
    get:
      security:
      - BearerToken: []
      tags:
      - Account
      summary: Get account settings
      operationId: get-account-settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountSettingsResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/settings/trading_value_display:
    post:
      security:
      - BearerToken: []
      description: To set user preferences for the trading value display on the UI, Spot Notional will use spot price, and Market Value will use the market price.
      tags:
      - Account
      summary: Updates account trading value display
      operationId: update-account-trading-value-display
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.UpdateTradingValueDisplayRequest'
        description: Update account trading value display request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AccountProfileResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/subaccounts:
    get:
      security:
      - BearerToken: []
      description: Respond with requester's list of sub-accounts
      tags:
      - Account
      summary: List sub-accounts of current account
      operationId: get-sub-accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetSubAccountsResponse'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/summary:
    get:
      security:
      - BearerToken: []
      description: Respond with account summaries for the account plus all authorized accounts.
      tags:
      - Account
      summary: Get account summaries (main account + authorized accounts)
      operationId: get-accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.AccountSummaryResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /balance:
    get:
      security:
      - BearerToken: []
      description: Respond with requester's own balances
      tags:
      - Account
      summary: List balances
      operationId: get-balance
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.BalanceResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /fills:
    get:
      security:
      - BearerToken: []
      description: 'This API returns a list of matched orders (i.e. fills) that have been sent to

        chain for settlement.'
      tags:
      - Account
      summary: List fills
      parameters:
      - description: Asset kind of the fill's market
        name: asset_kind
        in: query
        schema:
          type: string
          enum:
          - PERP
          - PERP_OPTION
          - OPTION
          - SPOT
      - description: Returns the ‘next’ paginated page.
        name: cursor
        in: query
        schema:
          type: string
      - description: End Time (unix time millisecond)
        name: end_at
        in: query
        schema:
          type: integer
      - description: Market symbol
        name: market
        in: query
        schema:
          type: string
      - description: Limit the number of responses in the page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - description: Start Time (unix time millisecond)
        name: start_at
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.FillResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
      operationId: getFills
      x-operation-id-source: derived
    servers:
    - url: https://api.prod.paradex.trade/v1
  /funding/payments:
    get:
      security:
      - BearerToken: []
      description: 'List funding payments made by/to the requester''s account


        *Funding payments are periodic payments between traders to make the perpetual

        futures contract price is close to the index price.*'
      tags:
      - Account
      summary: Funding payments history
      operationId: get-funding
      parameters:
      - description: Returns the ‘next’ paginated page.
        name: cursor
        in: query
        schema:
          type: string
      - description: End Time (unix time millisecond)
        name: end_at
        in: query
        schema:
          type: integer
      - example: BTC-USD-PERP
        description: Market for which funding payments are queried
        name: market
        in: query
        required: true
        schema:
          type: string
      - description: Limit the number of responses in the page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - description: Start Time (unix time millisecond)
        name: start_at
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.FundingPayment'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /positions:
    get:
      security:
      - BearerToken: []
      description: Get all positions owned by current user
      tags:
      - Account
      summary: List open positions
      operationId: get-positions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.PositionResp'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /tradebusts:
    get:
      security:
      - BearerToken: []
      description: 'Returns paginated tradebusts for the account.


        A tradebust occurs when a fill fails to clear and settle on the Paradex Chain.

        The results of busted fills are not reflected on-chain and are reverted in the

        cloud (off-chain position cache).'
      tags:
      - Account
      summary: List tradebusts
      operationId: tradebusts
      parameters:
      - description: Returns the ‘next’ paginated page.
        name: cursor
        in: query
        schema:
          type: string
      - description: End Time (unix time millisecond)
        name: end_at
        in: query
        schema:
          type: integer
      - description: Limit the number of responses in the page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - description: Start Time (unix time millisecond)
        name: start_at
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.TradebustResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /transactions:
    get:
      security:
      - BearerToken: []
      description: Retrieves a list of transactions initiated by the user
      tags:
      - Account
      summary: List transactions
      operationId: transactions
      parameters:
      - description: Returns the ‘next’ paginated page.
        name: cursor
        in: query
        schema:
          type: string
      - description: End Time (unix time millisecond)
        name: end_at
        in: query
        schema:
          type: integer
      - description: Limit the number of responses in the page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - description: Start Time (unix time millisecond)
        name: start_at
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.TransactionResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
