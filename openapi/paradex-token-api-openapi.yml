openapi: 3.2.0
info:
  title: Paradex Token API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Token across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Token
paths:
  /account/terminal-token:
    post:
      security:
      - BearerToken: []
      description: 'Mints a short-lived identity attestation for DIME Terminal:

        an ES256 JWT (typ "terminal+JWT", aud "dime-terminal", sub =

        the account address) signed with a dedicated key published in

        the JWKS. It proves account identity to the terminal and

        grants nothing on Paradex itself — no Paradex endpoint

        accepts it. Requires an interactive session authenticated

        with the account''s own key: readonly/API tokens, RPC tokens

        and subkey-scoped tokens are rejected. Sub-accounts and vault

        operators mint attestations for their own address.'
      tags:
      - Token
      summary: Mint a terminal identity token
      responses:
        '200':
          description: Terminal token minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AuthResp'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Not an interactive session with the account's own key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
      operationId: postAccountTerminalToken
      x-operation-id-source: derived
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/tokens:
    get:
      security:
      - BearerToken: []
      description: 'Get all tokens for the authenticated account with optional filtering by kind

        and status.'
      tags:
      - Token
      summary: List tokens
      operationId: list-tokens
      parameters:
      - description: Filter by token kind (e.g., 'jwt', 'api_key')
        name: kind
        in: query
        schema:
          type: string
      - description: Include revoked and expired tokens
        name: with_invalid
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: List of tokens
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.ApiToken'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: 'Create a new authentication token for the authenticated account with custom

        name and expiration duration.'
      tags:
      - Token
      summary: Create token
      operationId: create-token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.CreateToken'
        description: Token creation request
        required: true
      responses:
        '200':
          description: Token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.CreateTokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: IP restrictions not enabled for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/tokens/{lookup_id}:
    delete:
      security:
      - BearerToken: []
      description: Revoke an authentication token by its unique identifier.
      tags:
      - Token
      summary: Revoke token
      operationId: revoke-token
      parameters:
      - description: Token lookup ID
        name: lookup_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RevokeTokenResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/tokens/{lookup_id}/allowed-cidrs:
    put:
      security:
      - BearerToken: []
      description: Replace the IP CIDR allowlist for an auth token. Empty array clears the allowlist (unrestricted). Only callable from the main account session; subkey sessions cannot modify token allowlists.
      tags:
      - Token
      summary: Update token IP allowlist
      operationId: update-token-allowed-cidrs
      parameters:
      - description: Token lookup ID
        name: lookup_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/requests.UpdateAllowedCIDRs'
      responses:
        '200':
          description: Updated token details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiToken'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: IP restrictions not enabled for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
