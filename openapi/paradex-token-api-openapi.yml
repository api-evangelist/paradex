    responses.ApiToken:
      type: object
      properties:
        allowed_cidrs:
          description: IP CIDR allowlist; empty means unrestricted
          type: array
          items:
            type: string
          example:
          - '["203.0.113.0/24"]'
        created_at:
          description: Token creation timestamp (nanoseconds since epoch)
          type: integer
          example: 1640995200
        expiry_at:
          description: Expiration timestamp (nanoseconds since epoch)
          type: integer
          example: 1672531200
        kind:
          description: Token type (jwt, api_key, etc.)
          type: string
        last_updated_at:
          description: Last modification timestamp (nanoseconds since epoch)
          type: integer
          example: 1640995200
        lookup_id:
          description: Identifier used for the token lookup
          type: string
          example: uuid-123
        name:
          description: User-provided token name
          type: string
          example: My API Token
        revoked_at:
          description: Revocation timestamp (nanoseconds since epoch, 0 if not revoked)
          type: integer
          example: 0
        token_id:
          description: Unique ID for the auth token
          type: string
          example: token_123
    requests.UpdateAllowedCIDRs:
      type: object
      properties:
        allowed_cidrs:
          description: Full replacement list. Empty = unrestricted.
          type: array
          items:
            type: string
          example:
          - '["203.0.113.0/24"'
          - '"198.51.100.42/32"]'
    responses.APIResults:
      type: object
      properties:
        results:
          description: Array of results
          type: array
          items:
            type: object
    requests.CreateToken:
      type: object
      required:
      - expiry_duration
      - name
      - token_type
      properties:
        allowed_cidrs:
          description: 'Optional IP CIDR allowlist applied atomically at creation, so the token

            is never live unrestricted. Empty/omitted = unrestricted. Max 50 entries;

            same format as PUT /account/tokens/:lookup_id/allowed-cidrs.'
          type: array
          items:
            type: string
          example:
          - '["203.0.113.0/24"'
          - '"198.51.100.42/32"]'
        expiry_duration:
          description: Duration in seconds from now until expiration (1 min to 1 year).
          type: integer
          example: 86400
        name:
          description: User-friendly name for the JWT token.
          type: string
          example: My Long-term Trading Token
        token_type:
          description: Type of token to create.
          type: string
    responses.ApiError:
      type: object
      properties:
        data:
          description: any additional data related to the error
          type: object
        error:
          description: unique immutable string identifier for specific error
          allOf:
          - $ref: '#/components/schemas/responses.ErrorCode'
          example: NOT_ONBOARDED
        message:
          description: detailed description of error and how to address it
          type: string
          example: User has never called /onboarding endpoint
  requestBodies:
    requests.UpdateAllowedCIDRs:
      content:
