openapi: 3.2.0
info:
  title: Paradex Trades API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Trades across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Trades
paths:
  /trades:
    get:
      description: 'Returns a paginated list of trades that have occurred on the exchange.

        Default page size is 100, maximum is 1000.


        The `side` field in the response indicates the taker side of the trade.


        `block_id` appears on **block-trade prints only**. A block trade is

        published as one print per leg, and the block id every leg shares is what

        lets a client reassemble the package. No other kind of print carries the

        field.


        Note that the legs of one block trade are ordered by fill id like any other

        print, so a package can straddle a page boundary. `base_asset` also resolves

        to that underlying''s OPTION markets only, so a package''s perp delta hedge is

        not among the results — request the perp''s own market to see it.


        Pass `trade_type=BLOCK_TRADE` to return only block-trade prints (the legs of

        RFQ and block executions). It is the only value accepted; omit the parameter

        for every trade type. It is also the one case where `market` and

        `base_asset` may both be omitted: the page then covers every market on the

        exchange, perps included, so a package arrives with its delta hedge. A later

        page of any of these needs only its `cursor`: the scope a page was opened

        with travels inside it.


        ### Example


        ```http

        GET /trades?market=BTC-USD-PERP&page_size=100

        ```


        ```http

        GET /trades?base_asset=BTC&trade_type=BLOCK_TRADE&page_size=100

        ```


        ```http

        GET /trades?trade_type=BLOCK_TRADE&page_size=100

        ```


        This endpoint supports cursor-based pagination for efficiently traversing large

        result sets.'
      tags:
      - Trades
      summary: Trade tape
      operationId: trades
      parameters:
      - example: BTC
        description: Base asset symbol; returns trades across all active options (OPTION and PERP_OPTION) for this base asset. Mutually exclusive with market. One of the two is required unless trade_type=BLOCK_TRADE.
        name: base_asset
        in: query
        schema:
          type: string
      - description: Returns the ‘next’ paginated page.
        name: cursor
        in: query
        schema:
          type: string
      - description: End Time (unix time millisecond)
        name: end_at
        in: query
        schema:
          type: integer
      - example: BTC-USD-PERP
        description: Market name. Mutually exclusive with base_asset. One of the two is required unless trade_type=BLOCK_TRADE.
        name: market
        in: query
        schema:
          type: string
      - description: Limit the number of responses in the page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - description: Start Time (unix time millisecond)
        name: start_at
        in: query
        schema:
          type: integer
      - example: BLOCK_TRADE
        description: Narrows the page to one trade type. Only BLOCK_TRADE is supported; omit for every type. With BLOCK_TRADE, market and base_asset may both be omitted for an exchange-wide page.
        name: trade_type
        in: query
        schema:
          type: string
          enum:
          - BLOCK_TRADE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.TradeResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    responses.FillType:
      type: string
      enum:
      - LIQUIDATION
      - UNWIND_TRANSFER
      - FILL
      - SETTLE_MARKET
      - RPI
      - BLOCK_TRADE
      x-enum-varnames:
      - FillTypeLiquidation
      - FillTypeUnwindTransfer
      - FillTypeFill
      - FillTypeSettleMarket
      - FillTypeRPI
      - FillTypeBlockTrade
    responses.PaginatedAPIResults:
      type: object
      properties:
        next:
          description: The pointer to fetch next set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiMsIm1hcmtlciI6eyJtYXJrZXIiOiIxNjc1NjUwMDE3NDMxMTAxNjk5N=
        prev:
          description: The pointer to fetch previous set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiOnsiTGltaXQiOjkwfSwidGltZSI6MTY4MTY3OTgzNzk3MTMwOTk1MywibWFya2VyIjp7Im1zMjExMD==
        results:
          description: Array of paginated results
          type: array
          items:
            type: object
