        data:
          description: any additional data related to the error
          type: object
        error:
          description: unique immutable string identifier for specific error
          allOf:
          - $ref: '#/components/schemas/responses.ErrorCode'
          example: NOT_ONBOARDED
        message:
          description: detailed description of error and how to address it
          type: string
          example: User has never called /onboarding endpoint
    responses.TradeResult:
      type: object
      properties:
        block_id:
          description: Groups the legs settled together in one block execution, one id per accepted offer for offer-based blocks. Empty for non-block trades. Delivered on the JSON encoding only, not the SBE binary encoding.
          type: string
          example: '1681497002041000000'
        created_at:
          description: Unix Millisecond timestamp at which trade was done
          type: integer
          example: 1681497002041
        id:
          description: Unique Trade ID per TradeType
          type: string
          example: '12345643'
        market:
          description: Market for which trade was done
          type: string
          example: BTC-USD-PERP
        price:
          description: Trade price
          type: string
          example: '30001.2'
        side:
          description: Taker side
          allOf:
          - $ref: '#/components/schemas/responses.OrderSide'
        size:
          description: Trade size
          type: string
          example: '0.01'
        trade_type:
