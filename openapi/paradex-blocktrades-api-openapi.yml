openapi: 3.2.0
info:
  title: Paradex Block Trades API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged BlockTrades across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: BlockTrades
paths:
  /block-trades:
    get:
      security:
      - BearerToken: []
      description: 'Get a paginated list of block trades with filtering.


        Returns block trades where user is initiator, required signer,

        or has submitted an offer.


        **Filters:**

        - Status: CREATED, OFFER_COLLECTION, READY_TO_EXECUTE, EXECUTING, COMPLETED, CANCELLED

        - Market: Specific market symbol (e.g., BTC-USD-PERP)


        **Returns:** Paginated list with block trade details and navigation metadata.'
      tags:
      - BlockTrades
      summary: List block trades
      operationId: block-trades-list
      parameters:
      - description: Block trade status filter
        name: status
        in: query
        schema:
          type: string
          enum:
          - CREATED
          - OFFER_COLLECTION
          - READY_TO_EXECUTE
          - EXECUTING
          - COMPLETED
          - CANCELLED
      - description: 'Market symbol filter, ex: BTC-USD-PERP'
        name: market
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.BlockTradeDetailFullResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: 'Create a parent block trade for multi-party execution.


        Block trades coordinate execution across multiple parties.

        The initiator creates a parent block trade specifying trade details and

        required signers, who must submit offers before execution.


        **Requirements:**

        - Required signers must have active onboarding and block trade functionality

        - Valid StarkNet signature with expiration timestamp

        - Each trade specifies market, size, price, and order details


        **Workflow:**

        1. Initiator creates parent block trade

        2. Required signers submit offers

        3. Initiator executes with selected offers

        4. All trades processed together'
      tags:
      - BlockTrades
      summary: Create block trade
      operationId: block-trades-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.BlockTradeRequest'
        description: Block trade content
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BlockTradeDetailFullResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /block-trades/{block_trade_id}:
    get:
      security:
      - BearerToken: []
      description: 'Retrieve a specific block trade by ID with full details.


        Returns complete block trade information including status, trade details,

        signatures, and offers.


        **Access:** Available to initiator, required signers,

        or accounts with submitted offers.


        **Returns:**

        - Block ID and status

        (CREATED, OFFER_COLLECTION, READY_TO_EXECUTE, EXECUTING, COMPLETED, CANCELLED)

        - Market-specific trade details with orders and fill information

        - All collected signatures from required signers

        - Creation time, last update, expiration, and participant information'
      tags:
      - BlockTrades
      summary: Get block trade
      operationId: block-trades-get
      parameters:
      - description: Block Trade ID
        name: block_trade_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BlockTradeDetailFullResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    delete:
      security:
      - BearerToken: []
      description: 'Cancel a pending block trade.


        Only the initiator can cancel a block trade in cancellable state

        (CREATED, OFFER_COLLECTION, READY_TO_EXECUTE).

        Once cancelled,all associated offers become invalid.


        **Returns:** Success message confirming cancellation. Status updated to CANCELLED.'
      tags:
      - BlockTrades
      summary: Cancel block trade
      operationId: block-trades-cancel
      parameters:
      - description: Block Trade ID
        name: block_trade_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /block-trades/{block_trade_id}/execute:
    post:
      security:
      - BearerToken: []
      description: 'Execute a block trade with selected offers.


        Executes a parent block trade by selecting specific offers from required signers.


        **Requirements:**

        - Called by block trade initiator

        - All selected offers must have valid, unexpired signatures

        - Required signers must have submitted offers for all markets

        - Block trade must be in READY_TO_EXECUTE state


        **Execution Process:**

        - All trades processed together

        - Creates fills and updates balances upon success

        - Participants receive fill notifications


        **Returns:** Executed block trade with status (COMPLETED/FAILED), fill details,

        timestamps, and settlement info.'
      tags:
      - BlockTrades
      summary: Execute block trade
      operationId: block-trades-execute
      parameters:
      - description: Block Trade ID
        name: block_trade_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.BlockExecuteRequest'
        description: Block execution parameters
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BlockTradeDetailFullResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /block-trades/{block_trade_id}/offers:
    get:
      security:
      - BearerToken: []
      description: 'Get all offers for a specific block trade.


        Returns all offers submitted for a parent block trade by required signers.


        **Access:** Available to initiator, required signers,

        or accounts with submitted offers.


        **Returns:** Array of offers with:

        - Offer ID and parent block trade reference

        - Offering account and trade details per market

        - Execution signatures and timestamps

        - Current offer state and execution details'
      tags:
      - BlockTrades
      summary: Get block trade offers
      operationId: block-offers-list
      parameters:
      - description: Parent Block Trade ID
        name: block_trade_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.BlockTradeDetailFullResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: 'Create a sub-block offer for an existing block trade.


        Required signers submit their order details and pricing for

        markets defined in the parent block trade.


        **Requirements:**

        - Account must be listed as required signer with active onboarding

        - Valid order signatures for all markets

        - Orders must match parent block trade constraints


        **Includes:**

        - Individual order signatures per market

        - Block trade execution signature with expiration

        - Proper nonce and signature verification data


        Returns the created offer with unique ID, parent reference, and order details.'
      tags:
      - BlockTrades
      summary: Create block trade offer
      operationId: block-offers-create
      parameters:
      - description: Parent Block Trade ID
        name: block_trade_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.BlockOfferRequest'
        description: Block offer content
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BlockTradeDetailFullResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /block-trades/{block_trade_id}/offers/{offer_id}:
    get:
      security:
      - BearerToken: []
      description: 'Get a specific offer by ID for a block trade.


        Retrieves detailed information about an offer submitted for a parent block trade.


        **Access:** Available to initiator, required signers, or the offering account.


        **Returns:**

        - Offer ID and parent block trade reference

        - Market-specific order information with pricing/sizing

        - StarkNet signatures and verification data

        - Execution status and timestamps'
      tags:
      - BlockTrades
      summary: Get specific block trade offer
      operationId: block-offers-get
      parameters:
      - description: Parent Block Trade ID
        name: block_trade_id
        in: path
        required: true
        schema:
          type: string
      - description: Offer ID
        name: offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BlockTradeDetailFullResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    delete:
      security:
      - BearerToken: []
      description: 'Cancel a pending offer for a block trade.


        Only the offering account can cancel their own offer if it''s in

        a cancellable state and the parent block trade is still active.


        **Returns:** Success message confirming offer cancellation.

        Status updated to CANCELLED.'
      tags:
      - BlockTrades
      summary: Cancel block trade offer
      operationId: block-offers-cancel
      parameters:
      - description: Parent Block Trade ID
        name: block_trade_id
        in: path
        required: true
        schema:
          type: string
      - description: Offer ID
        name: offer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /block-trades/{block_trade_id}/offers/{offer_id}/execute:
    post:
      security:
      - BearerToken: []
      description: 'Execute a specific offer independently of the parent block trade.


        Executes an individual offer without waiting for full block trade execution.


        **Requirements:**

        - Called by authorized account (initiator, offering account, or required signer)

        - Valid signatures from all required parties

        - Unexpired signatures and executable offer state


        **Independent Execution:**

        - Processes only the specific offer''s trades

        - Does not require other offers to be ready

        - Executes all trades in the offer together


        **Returns:** Executed offer with status, fill details, timestamps, and updated balances.'
      tags:
      - BlockTrades
      summary: Execute individual offer
      operationId: block-offers-execute
      parameters:
      - description: Parent Block Trade ID
        name: block_trade_id
        in: path
        required: true
        schema:
          type: string
      - description: Offer ID
        name: offer_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.BlockExecuteRequest'
        description: Offer execution parameters
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BlockTradeDetailFullResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    requests.BlockExecuteRequest:
      type: object
      required:
      - execution_nonce
      - signatures
      properties:
        execution_nonce:
          description: Unique nonce for this execution request
          type: string
          example: execution_001
        selected_offers:
          description: Array of offer IDs selected for execution (offers are atomic, not partial)
          type: array
          items:
            type: string
        signatures:
          description: Map of offer IDs to initiator signatures accepting each offer. Block id if it is a direct block trade.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/responses.BlockTradeSignature'
    responses.FillFlag:
      type: string
      enum:
      - interactive
      - rpi
      - fastfill
      x-enum-comments:
        FillFlagFast: Retail order was fast filled
        FillFlagInteractive: Fill was generated from an interactive order (user-initiated)
        FillFlagRPI: Fill qualifies for Retail Price Improvement
      x-enum-varnames:
      - FillFlagInteractive
      - FillFlagRPI
      - FillFlagFast
    responses.BlockTradeSignature:
      type: object
      required:
      - nonce
      - signature_data
      - signature_expiration
      - signature_timestamp
      - signature_type
      - signer_account
      properties:
        nonce:
          description: Unique nonce to prevent replay attacks
          type: string
          example: '12345'
        signature_data:
          description: Order signature in as a string "[r,s]" signed by account's paradex private key
          type: string
          example: 0xabc123...
        signature_expiration:
          description: Unix timestamp in milliseconds when signature expires
          type: integer
          example: 1640995800000
        signature_timestamp:
          description: Unix timestamp in milliseconds when signature was created
          type: integer
          example: 1640995200000
        signature_type:
          description: Type of cryptographic signature used
          type: string
          enum:
          - STARKNET
          example: STARKNET
        signer_account:
          description: Paradex account address of the signer
          type: string
          example: '0x1234567890abcdef'
        signer_public_key:
          description: Hex pubkey used to sign (main account key or active subkey). Empty defaults to account main key.
          type: string
          example: 0xabc...
    requests.BlockOfferInfo:
      type: object
      required:
      - offerer_order
      - price
      - size
      properties:
        offerer_order:
          description: Order details from the offering account
          allOf:
          - $ref: '#/components/schemas/responses.BlockTradeOrder'
        price:
          description: Offered price for this market
          type: string
          example: '30050.00'
        size:
          description: Offered size for this market
          type: string
          example: '5.0'
    requests.BlockTradeRequest:
      type: object
      required:
      - block_expiration
      - nonce
      - required_signers
      - signatures
      - trades
      properties:
        block_expiration:
          description: Unix timestamp in milliseconds when block expires
          type: integer
          example: 1640995800000
        nonce:
          description: Unique nonce for this block trade request
          type: string
          example: '67890'
        required_signers:
          description: List of accounts that can participate in the block trade
          type: array
          items:
            type: string
        signatures:
          description: Map of account addresses to their signatures. Can be empty or partial.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/responses.BlockTradeSignature'
        trades:
          description: Map of market symbol to trade info (one per market)
          type: object
          additionalProperties:
            $ref: '#/components/schemas/requests.BlockTradeInfo'
    responses.BlockTradeDetailResponse:
      type: object
      properties:
        executed_at:
          description: When this trade was executed
          type: integer
          example: 1640995500000
        failure_reason:
          description: 'Reason for failure (if failed). Names a participant by role, never by address: <maker>, <taker>, <initiator>, <participant> (a party whose side is ambiguous), or <redacted> (an identifier belonging to no participant)'
          type: string
        maker_account:
          description: Maker account (if fully executable)
          type: string
          example: 0x123...abc
        maker_fill:
          description: Execution details (if executed)
          allOf:
          - $ref: '#/components/schemas/responses.FillResult'
        maker_order:
          description: Original maker order (for signature generation)
          allOf:
          - $ref: '#/components/schemas/responses.BlockTradeOrder'
        market:
          description: Trading pair for this trade
          type: string
          example: BTC-USD-PERP
        price:
          description: Agreed price (if fully executable)
          type: string
          example: '30000.00'
        size:
          description: Agreed size (if fully executable)
          type: string
          example: '10.5'
        taker_account:
          description: Taker account (if fully executable)
          type: string
          example: 0x456...def
        taker_fill:
          description: Execution details (if executed)
          allOf:
          - $ref: '#/components/schemas/responses.FillResult'
        taker_order:
          description: Original taker order (for signature generation)
          allOf:
          - $ref: '#/components/schemas/responses.BlockTradeOrder'
        trade_constraints:
          description: Constraints for offers (if offer-based)
          allOf:
          - $ref: '#/components/schemas/responses.BlockTradeConstraints'
        trade_id:
          description: Backend-generated unique identifier for this trade
          type: string
          example: trade_123
    requests.BlockOfferRequest:
      type: object
      required:
      - nonce
      - offering_account
      - signature
      - trades
      properties:
        nonce:
          description: Unique nonce for this offer request
          type: string
          example: '98765'
        offering_account:
          description: Starknet address of the account making this offer
          type: string
          example: '0xabcdef1234567890'
        signature:
          description: Cryptographic signature authorizing this offer
          allOf:
          - $ref: '#/components/schemas/responses.BlockTradeSignature'
        trades:
          description: Map of market symbol to offer details
          type: object
          additionalProperties:
            $ref: '#/components/schemas/requests.BlockOfferInfo'
    responses.BlockTradeType:
      type: string
      enum:
      - DIRECT
      - OFFER_BASED
      x-enum-varnames:
      - BlockTradeTypeDirect
      - BlockTradeTypeOffer
    responses.TraderRole:
      type: string
      enum:
      - TAKER
      - MAKER
      x-enum-varnames:
      - TraderRoleTaker
      - TraderRoleMaker
    responses.FillType:
      type: string
      enum:
      - LIQUIDATION
      - UNWIND_TRANSFER
      - FILL
      - SETTLE_MARKET
      - RPI
      - BLOCK_TRADE
      x-enum-varnames:
      - FillTypeLiquidation
      - FillTypeUnwindTransfer
      - FillTypeFill
      - FillTypeSettleMarket
      - FillTypeRPI
      - FillTypeBlockTrade
    responses.PaginatedAPIResults:
      type: object
      properties:
        next:
          description: The pointer to fetch next set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiMsIm1hcmtlciI6eyJtYXJrZXIiOiIxNjc1NjUwMDE3NDMxMTAxNjk5N=
        prev:
          description: The pointer to fetch previous set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiOnsiTGltaXQiOjkwfSwidGltZSI6MTY4MTY3OTgzNzk3MTMwOTk1MywibWFya2VyIjp7Im1zMjExMD==
        results:
          description: Array of paginated results
          type: array
          items:
            type: object
    responses.ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - BINDING_ERROR
      - INTERNAL_ERROR
      - NOT_FOUND
      - SERVICE_UNAVAILABLE
      - INVALID_REQUEST_PARAMETER
      - ORDER_ID_NOT_FOUND
      - ORDER_IS_CLOSED
      - ORDER_IS_NOT_OPEN
      - INVALID_ORDER_SIZE
      - CLIENT_ORDER_ID_NOT_FOUND
      - DUPLICATED_CLIENT_ID
      - INVALID_SYMBOL
      - INVALID_TOKEN
      - INVALID_ETHEREUM_ADDRESS
      - INVALID_ETHEREUM_SIGNATURE
      - INVALID_STARKNET_ADDRESS
      - INVALID_STARKNET_SIGNATURE
      - STARKNET_SIGNATURE_VERIFICATION_FAILED
      - ETHEREUM_SIGNER_MISMATCH
      - ETHEREUM_HASH_MISMATCH
      - NOT_ONBOARDED
      - INVALID_TIMESTAMP
      - INVALID_BLOCK_EXPIRATION
      - ACCOUNT_NOT_FOUND
      - MEDIA_NOT_FOUND
      - INVALID_ORDER_SIGNATURE
      - PUBLIC_KEY_INVALID
      - UNAUTHORIZED_ETHEREUM_ADDRESS
      - UNAUTHORIZED_ERROR
      - ETHEREUM_ADDRESS_ALREADY_ONBOARDED
      - EVM_ADDRESS_ALREADY_ONBOARDED
      - MARKET_NOT_FOUND
      - ALLOWLIST_ENTRY_NOT_FOUND
      - USERNAME_IN_USE
      - GEO_IP_BLOCK
      - ETHEREUM_ADDRESS_BLOCKED
      - PROGRAM_NOT_FOUND
      - PROGRAM_NOT_SUPPORTED
      - INVALID_DASHBOARD
      - MARKET_NOT_OPEN
      - MARKET_NOT_SETTLED
      - INVALID_REFERRAL_CODE
      - REQUEST_NOT_ALLOWED
      - PARENT_ADDRESS_ALREADY_ONBOARDED
      - INVALID_PARENT_ACCOUNT
      - INVALID_VAULT_OPERATOR_CHAIN
      - VAULT_OPERATOR_ALREADY_ONBOARDED
      - VAULT_NAME_IN_USE
      - VAULT_NOT_FOUND
      - VAULT_STRATEGY_NOT_FOUND
      - VAULT_LIMIT_REACHED
      - VAULT_DATA_PRIVATE
      - BATCH_SIZE_OUT_OF_RANGE
      - ISOLATED_MARKET_ACCOUNT_MISMATCH
      - NO_ACCESS_TO_MARKET
      - POINTS_SUMMARY_NOT_FOUND
      - ALGO_ID_NOT_FOUND
      - INVALID_DERIVATION_PATH
      - PROFILE_STATS_NOT_FOUND
      - INVALID_CHAIN
      - INVALID_LAYERSWAP_SWAP
      - INVALID_DEPOSIT_ADDRESS
      - SOCIAL_USERNAME_IN_USE
      - INVALID_OAUTH_REQUEST
      - RPI_ACCOUNT_NOT_WHITELISTED
      - SYSTEM_STATUS_POST_ONLY
      - SYSTEM_STATUS_CANCEL_ONLY
      - INVALID_MARKETING_CODE
      - OFFER_NOT_FOUND
      - MARKET_MARGIN_RESTRICTED
      - NOT_UNIQUE
      - ACCOUNT_ALREADY_REFERRED
      - ONBOARDING_PERIOD_EXPIRED
      - ONBOARDING_RATE_LIMITED
      - RFQ_CREATE_BUDGET_EXCEEDED
      - SUBACCOUNTS_LIMIT_EXCEEDED
      - INSUFFICIENT_MIN_CHAIN_BALANCE
      - INSUFFICIENT_EVM_BALANCE
      - PORTFOLIO_MARGIN_ONBOARDING_DISABLED
      - PORTFOLIO_MARGIN_INVALID_ACCOUNT_KIND
      - EVM_VAULT_OPERATORS_DISABLED
      - VAULT_OPERATOR_OWNER_PROOF_REQUIRED
      - INVALID_EVM_SIGNATURE
      - EVM_SIGNATURE_VERIFICATION_FAILED
      - INVALID_SUBKEY
      - SUBKEY_NOT_ACTIVATABLE
      - SUBKEY_REVOKED
      - TOKEN_LIMIT_REACHED
      - INVALID_TOKEN_SCOPE
