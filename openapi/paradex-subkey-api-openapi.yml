openapi: 3.2.0
info:
  title: Paradex Subkey API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Subkey across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Subkey
paths:
  /account/keys/subkeys:
    get:
      security:
      - BearerToken: []
      description: Get all subkeys for the authenticated account with optional filtering by status.
      tags:
      - Subkey
      summary: List Subkeys
      operationId: list-subkeys
      parameters:
      - description: Include revoked subkeys
        name: with_revoked
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: List of subkeys
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.Subkey'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: Register a new subkey for the authenticated account.
      tags:
      - Subkey
      summary: Register Subkey
      operationId: register-subkey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.CreateSubkey'
        description: Subkey registration request
        required: true
      responses:
        '201':
          description: An empty response
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: IP restrictions not enabled for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/keys/subkeys/activate:
    post:
      description: 'Activate a pending subkey by providing a Starknet signature

        over `pedersen(timestamp, eph_public_key)`.'
      tags:
      - Subkey
      summary: Activate pending subkey
      operationId: activate-subkey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.ActivateSubkey'
        description: Subkey activation request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/requests.ActivateSubkeyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/keys/subkeys/{public_key}:
    get:
      security:
      - BearerToken: []
      description: Get a specific subkey for the authenticated account by its public key.
      tags:
      - Subkey
      summary: Get Subkey
      operationId: get-subkey
      parameters:
      - description: Subkey public key
        name: public_key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subkey details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Subkey'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    put:
      security:
      - BearerToken: []
      description: Update properties of an existing subkey for the authenticated account.
      tags:
      - Subkey
      summary: Update Subkey
      operationId: update-subkey
      parameters:
      - description: Subkey public key
        name: public_key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.UpdateSubkey'
        description: Update subkey request
        required: true
      responses:
        '200':
          description: Updated subkey details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Subkey'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    delete:
      security:
      - BearerToken: []
      description: Revoke a subkey for the authenticated account.
      tags:
      - Subkey
      summary: Revoke Subkey
      operationId: revoke-subkey
      parameters:
      - description: Subkey public key
        name: public_key
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Subkey revoked successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RevokeSubkeyResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/keys/subkeys/{public_key}/allowed-cidrs:
    put:
      security:
      - BearerToken: []
      description: Replace the IP CIDR allowlist for a subkey. Empty array clears the allowlist (unrestricted). Only callable with the main account; subkeys cannot widen their own allowlist.
      tags:
      - Subkey
      summary: Update subkey IP allowlist
      operationId: update-subkey-allowed-cidrs
      parameters:
      - description: Subkey public key
        name: public_key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/requests.UpdateAllowedCIDRs'
      responses:
        '200':
          description: Updated subkey details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Subkey'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: IP restrictions not enabled for this account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /account/keys/subkeys/{public_key}/block-trade-signing:
    put:
      security:
      - BearerToken: []
      description: Set whether an active subkey is enabled to sign block trades (create, offer and execute signatures) for the account. Subkeys start with it off. The Paradigm RFQ delegation key follows its delegation instead, and changing it is rejected with 400, as is a subkey that is not active yet. Only callable with the main account.
      tags:
      - Subkey
      summary: Set subkey block trade signing
      operationId: update-subkey-block-trade-signing
      parameters:
      - description: Subkey public key
        name: public_key
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.UpdateSubkeyBlockTradeSigning'
        description: Block trade signing setting
        required: true
      responses:
        '200':
          description: Updated subkey details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.Subkey'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    requests.CreateSubkey:
      type: object
      required:
      - name
      - public_key
      properties:
        allowed_cidrs:
          description: 'Optional IP CIDR allowlist applied atomically at creation, so the subkey

            is never live unrestricted. Empty/omitted = unrestricted. Max 50 entries;

            same format as PUT .../allowed-cidrs (e.g. "203.0.113.0/24"). Not covered

            by the registration signature: the list is mutable post-creation via the

            JWT-only allowed-cidrs endpoint, so signing it would add no protection.'
          type: array
          items:
            type: string
          example:
          - '["203.0.113.0/24"'
          - '"198.51.100.42/32"]'
        encrypted_key:
          description: Encrypted private key (required if state=pending).
          type: string
          example: 0xabc...
        eph_public_key:
          description: Ephemeral public key for signature verification (required if state=pending).
          type: string
          example: 0x123...
        evm_signature:
          description: 'EVM (EIP-191) registration signature, used in place of `signature` /

            `signature_timestamp` / `signature_expiry` when the account''s main

            key is a secp256k1 key (AccountSignerType == EIP191). The server

            reconstructs nothing — the raw SIWE message presented to the user is

            supplied verbatim in `siwe_message` and the personal_sign signature

            in `evm_signature`. The SIWE message''s Statement must equal

            "Paradex Subkey Registration: 0x<new_subkey_pubkey>" (lowercased

            pubkey); that line is what binds the authorisation to the specific

            subkey being registered.'
          type: string
          example: 0x...
        name:
          description: User-friendly name for the subkey.
          type: string
          example: My Trading Subkey
        public_key:
          description: Public key to be registered as a subkey.
          type: string
          example: '0x3d9f2b2e5f50c1aade60ca540368cd7490160f41270c192c05729fe35b656a9'
        signature:
          description: 'Signature from the account''s main StarkNet private key over

            pedersen_array(account, public_key, signature_timestamp, signature_expiry).

            Required when the server enforces main-key authorization on subkey

            registration (feature flag EnableSubkeyRegistrationSignature). Format: [r, s].'
          type: array
          items:
            type: string
          example:
          - '["0xr..."'
          - '"0xs..."]'
        signature_expiry:
          description: Unix seconds; included in signed message and bounds replay window.
          type: integer
          example: 1706400600
        signature_timestamp:
          description: Unix seconds; included in signed message.
          type: integer
          example: 1706400000
        siwe_message:
          type: string
          example: app.paradex.trade wants you to sign in...
        state:
          description: 'State of the subkey: ''active'' or ''pending''. Defaults to ''active''.'
          type: string
          default: active
          example: active
    requests.ActivateSubkeyResponse:
      type: object
      properties:
        encrypted_key:
          description: Encrypted private key returned to client.
          type: string
          example: 0xabc...
    responses.RevokeSubkeyResponse:
      type: object
      properties:
        public_key:
          description: The public key of the revoked subkey
          type: string
          example: '0xabcdef1234567890abcdef'
    requests.UpdateSubkey:
      type: object
      required:
      - name
      properties:
        name:
          description: New name for the subkey.
          type: string
          example: My Updated Device Name
    responses.ErrorCode:
      type: string
