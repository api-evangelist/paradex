    responses.Subkey:
      type: object
      properties:
        account_id:
          description: Account ID that owns this subkey
          type: string
          example: '0x1234567890abcdef'
        allowed_cidrs:
          description: IP CIDR allowlist; empty means unrestricted
          type: array
          items:
            type: string
          example:
          - '["203.0.113.0/24"]'
        block_trade_signing_enabled:
          description: 'Whether this subkey is enabled for block trade signing (create, offer

            and execute signatures) for its account: it is active, and either the

            account owner enabled it with the main key or it is the Paradigm RFQ

            delegation key, which follows its delegation. Always false for pending

            and revoked subkeys.'
          type: boolean
          example: false
        created_at:
          description: Subkey creation timestamp (nanoseconds since epoch)
          type: integer
          example: 1640995200
        id:
          description: Unique subkey identifier
          type: integer
          example: 1
        name:
          description: User-provided subkey name
          type: string
          example: My Subkey
        public_key:
          description: Subkey public key
          type: string
          example: '0xabcdef1234567890abcdef'
        revoked_at:
          description: Revocation timestamp (nanoseconds since epoch, 0 if not revoked)
          type: integer
          example: 0
        state:
          description: Subkey state
          type: string
        updated_at:
          description: Last modification timestamp (nanoseconds since epoch)
          type: integer
          example: 1640995200
    requests.UpdateAllowedCIDRs:
      type: object
      properties:
        allowed_cidrs:
          description: Full replacement list. Empty = unrestricted.
          type: array
          items:
            type: string
          example:
          - '["203.0.113.0/24"'
          - '"198.51.100.42/32"]'
    responses.APIResults:
      type: object
      properties:
        results:
          description: Array of results
          type: array
          items:
            type: object
    responses.ApiError:
      type: object
      properties:
        data:
          description: any additional data related to the error
          type: object
        error:
          description: unique immutable string identifier for specific error
          allOf:
          - $ref: '#/components/schemas/responses.ErrorCode'
          example: NOT_ONBOARDED
        message:
          description: detailed description of error and how to address it
          type: string
          example: User has never called /onboarding endpoint
    requests.UpdateSubkeyBlockTradeSigning:
      type: object
      required:
      - enabled
