openapi: 3.2.0
info:
  title: Paradex Liquidations API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Liquidations across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Liquidations
paths:
  /liquidations:
    get:
      security:
      - BearerToken: []
      description: Retrieves a list of liquidations associated to the requester's account
      tags:
      - Liquidations
      summary: List liquidations
      operationId: get-liquidations
      parameters:
      - description: Start Time (unix time millisecond)
        name: from
        in: query
        schema:
          type: integer
      - description: End Time (unix time millisecond)
        name: to
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.LiquidationResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    responses.ApiError:
      type: object
      properties:
        data:
          description: any additional data related to the error
          type: object
        error:
          description: unique immutable string identifier for specific error
          allOf:
          - $ref: '#/components/schemas/responses.ErrorCode'
          example: NOT_ONBOARDED
        message:
          description: detailed description of error and how to address it
          type: string
          example: User has never called /onboarding endpoint
    responses.APIResults:
      type: object
      properties:
        results:
          description: Array of results
          type: array
          items:
            type: object
    responses.LiquidationResp:
      type: object
      properties:
        created_at:
          description: Liquidation created at timestamp
          type: integer
          example: 1697213130097
        id:
          description: Liquidation transaction hash
          type: string
          example: '0x123456789'
