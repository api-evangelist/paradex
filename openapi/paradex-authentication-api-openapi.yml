openapi: 3.2.0
info:
  title: Paradex Authentication API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Authentication across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Authentication
paths:
  /auth:
    post:
      description: 'Authenticate using signed payload to get a JWT for usage in other endpoints


        There are multiple valid headers required to be sent as part of this request.


        For onboarding examples, refer to `go`, `java` and `python` code in code-samples.


        #### StarkNet Message Hash and Signature


        Inspired by EIP-712,

        (a standard for hashing and signing typed structured data)

        the encoding of an off-chain message is defined as:


        `signed_data = Enc[PREFIX_MESSAGE, domain_separator, account, hash_struct(message)]`


        where:


        - `PREFIX_MESSAGE = "StarkNet Message"`

        - `domain_separator` is defined as the `hash_struct` of the StarkNetDomain struct:

        * Struct contains: `name`, `chainId` and `version`

        * `chainId` is can be obtained calling `GET /system/config`

        - `account` is the StarkNet account address

        - The message to be hashed is represented as a struct

        * `hash_struct(message) = Enc[type_hash(MyStruct), Enc[param1], ..., Enc[paramN]]`

        * where `type_hash` is defined as in EIP-712 (but using `selector` instead of `keccak`)

        * More details on StarkNet - Hash Functions


        In case of more complex structure of object, you have to work in the spirit of EIP-712.

        This json structure has 4 mandatory items: `types`, `primaryType`, `domain` and `message`.

        These items are designed to be able to be an interface with a wallet.

        At sign request, the wallet will display:


        - `message` will be displayed at the bottom of the wallet display,

        showing clearly (not in hex) the message to sign.

        Its structure has to be in accordance with the type listed in primaryType,

        defined in types.

        - `domain` will be shown above the message.

        Its structure has to be in accordance with `StarkNetDomain`.


        The predefined types that you can use :


        - `felt` : for an integer on 251 bits.

        - `felt*` : for an array of felt.

        - `string` : for a shortString of 31 ASCII characters max.

        - `selector` : for a name of a smart contract function.

        - `merkletree` : for a Root of a Merkle tree, calculated with the provided data.


        Specification details: Signing transactions and off-chain messages


        #### Message Hash Sample Code


        For a complete `message_hash` example, refer to `python` code in code-samples.


        > Examples:


        ```json

        {

        "paradex-signature-expiration": 1682364556,

        "paradex-starknet-account": "0x129f3dc1b8962d8a87abc692424c78fda963ade0e1cd17bf3d1c26f8d41ee7a",

        "paradex-starknet-signature": [

        "1381323390094460587764867648394252677239485992175346764030313478865763678671",

        "396490140510115262427678549757564216013606350105112805717359873954984880589"

        ],

        "paradex-timestamp": 1681759756

        }

        ```'
      tags:
      - Authentication
      summary: Get JWT
      operationId: auth
      parameters:
      - description: Starknet account
        name: PARADEX-STARKNET-ACCOUNT
        in: header
        required: true
        schema:
          type: string
      - description: Starknet signature
        name: PARADEX-STARKNET-SIGNATURE
        in: header
        required: true
        schema:
          type: string
      - description: Timestamp when the signature was created
        name: PARADEX-TIMESTAMP
        in: header
        required: true
        schema:
          type: string
      - description: Timestamp when signature expires (default 30 min | Max 1 week)
        name: PARADEX-SIGNATURE-EXPIRATION
        in: header
        schema:
          type: string
      - description: Optional flag to authorize all isolated market accounts linked to the main account. When set to true, the returned JWT will grant trading access to all isolated accounts. Defaults to false if not specified
        name: PARADEX-AUTHORIZE-ISOLATED-MARKETS
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AuthResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /jwks.json:
    get:
      description: Returns the JSON Web Key Set used to validate JWT tokens issued by this service
      tags:
      - Authentication
      summary: Get JWKS
      operationId: jwks
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.JwksResponse'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /onboarding:
    get:
      description: Returns the Paradex address and derivation info for a given identity
      tags:
      - Authentication
      summary: Check onboarding status
      operationId: getOnboarding
      parameters:
      - description: Starknet public key (required when account_signer_type=starknet)
        name: public_key
        in: query
        schema:
          type: string
      - description: Ethereum address (required when account_signer_type=eip191)
        name: eth_address
        in: query
        schema:
          type: string
      - description: 'Signer variant: starknet or eip191'
        name: account_signer_type
        in: query
        required: true
        schema:
          type: string
      - description: EVM vault operator index (eip191 only; requires EnableEvmVaultOperators)
        name: vault_operator_index
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetOnboardingResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      description: 'Onboarding verifies that the caller owns the StarkNet address and enters them

        into the database. This call is idempotent.'
      tags:
      - Authentication
      summary: Onboarding
      operationId: onboarding
      parameters:
      - description: Ethereum account used to onboard
        name: PARADEX-ETHEREUM-ACCOUNT
        in: header
        required: true
        schema:
          type: string
      - description: Starknet address
        name: PARADEX-STARKNET-ACCOUNT
        in: header
        required: true
        schema:
          type: string
      - description: Starknet signature
        name: PARADEX-STARKNET-SIGNATURE
        in: header
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/requests.Onboarding'
      responses:
        '200':
          description: An empty response
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /v2/auth:
    post:
      description: Authenticate an EVM account using SIWE signature and return a JWT
      tags:
      - Authentication
      summary: EVM Get JWT
      operationId: evmAuth
      parameters:
      - description: Starknet account
        name: PARADEX-STARKNET-ACCOUNT
        in: header
        required: true
        schema:
          type: string
      - description: EVM personal_sign signature
        name: PARADEX-EVM-SIGNATURE
        in: header
        required: true
        schema:
          type: string
      - description: Base64-encoded SIWE message
        name: PARADEX-SIWE-MESSAGE
        in: header
        required: true
        schema:
          type: string
      - description: Optional flag to authorize all isolated market accounts
        name: PARADEX-AUTHORIZE-ISOLATED-MARKETS
        in: header
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AuthResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /v2/onboarding:
    post:
      description: Onboard a new EVM account using SIWE signature
      tags:
      - Authentication
      summary: EVM Onboarding
      operationId: evmOnboarding
      parameters:
      - description: Starknet account
        name: PARADEX-STARKNET-ACCOUNT
        in: header
        required: true
        schema:
          type: string
      - description: EVM personal_sign signature
        name: PARADEX-EVM-SIGNATURE
        in: header
        required: true
        schema:
          type: string
      - description: Base64-encoded SIWE message
        name: PARADEX-SIWE-MESSAGE
        in: header
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/requests.Onboarding'
      responses:
        '200':
          description: An empty response
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
