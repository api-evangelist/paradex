      type: object
      properties:
        campaign:
          description: UTM campaign parameter
          type: string
          example: summer2024
        source:
          description: UTM source parameter
          type: string
          example: google
        type:
          description: UTM type parameter
          type: string
          example: clickthrough
    requests.Onboarding:
      type: object
      properties:
        marketing_code:
          description: Marketing code of the campaign the user is being onboarded via.
          type: string
          example: abcd:code1
        portfolio_margin:
          description: When true, the new account is onboarded directly into Portfolio Margin mode. Only valid for main accounts and subaccounts.
          type: boolean
        public_key:
          description: Public key of the user being onboarded.
          type: string
          example: '0x3d9f2b2e5f50c1aade60ca540368cd7490160f41270c192c05729fe35b656a9'
        referral_code:
          description: Referral code of the user who referred the user being onboarded.
          type: string
          example: cryptofox8
        utm:
          description: UTM tracking parameters (optional).
          allOf:
          - $ref: '#/components/schemas/requests.Utm'
