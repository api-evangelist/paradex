openapi: 3.2.0
info:
  title: Paradex Vaults API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Vaults across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Vaults
paths:
  /vaults:
    get:
      description: Get list of available vaults.
      tags:
      - Vaults
      summary: Get vaults
      operationId: vaults-get
      parameters:
      - description: Vault Address
        name: address
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.VaultResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: 'Create a new vault by providing deployment parameters.Current user will

        be set as owner of the account and a new sub-account will be deployed as

        vault operator.


        To create a Starknet vault operator, send the vault owner''s main-key

        session JWT as the bearer token. Subkey, readonly and RPC tokens do not

        prove ownership. A request without that token is rejected with

        `VAULT_OPERATOR_OWNER_PROOF_REQUIRED`.'
      tags:
      - Vaults
      summary: Create vault
      operationId: vaults-create
      parameters:
      - description: Onboarded by prdx:0xa123456789
        name: PARADEX-PARENT-ACCOUNT
        in: header
        required: true
        schema:
          type: string
      - description: Starknet signature
        name: PARADEX-STARKNET-SIGNATURE
        in: header
        required: true
        schema:
          type: string
      - description: Starknet address
        name: PARADEX-STARKNET-ACCOUNT
        in: header
        required: true
        schema:
          type: string
      - description: Account derivation path - m/44'/9004'/0'/0/1
        name: PARADEX-STARKNET-ACCOUNT-DERIVATION-PATH
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.CreateVault'
        description: Vault parameters
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.VaultResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /vaults/account-summary:
    get:
      security:
      - BearerToken: []
      description: 'Get current user summary metrics for all vaults or for the single vault

        specified by address. User metrics are only returned if the current user

        is a depositor for the vault.'
      tags:
      - Vaults
      summary: Get vault account summary
      operationId: vaults-get-account-summary
      parameters:
      - description: Vault Address
        name: address
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.VaultAccountSummaryResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /vaults/analytics:
    get:
      description: Returns the vault-level analytics row plus per-substrategy analytics rows for a single vault. vault_level is null when the vault has no analytics blob yet; substrategies only contains entries whose Redis blob is present. 404 only when the vault itself does not exist — missing analytics data returns 200 with empty fields.
      tags:
      - Vaults
      summary: Get combined vault-level and substrategy analytics for a vault
      operationId: vaults-get-analytics
      parameters:
      - description: Vault address
        name: address
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.VaultAnalyticsResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /vaults/balance:
    get:
      description: Get spot balance of a vault
      tags:
      - Vaults
      summary: Get vault balances
      operationId: vaults-get-balance
      parameters:
      - description: Vault Address
        name: address
        in: query
        required: true
        schema:
          type: string
      - description: Vault Strategy Address
        name: strategy
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.BalanceResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: VAULT_DATA_PRIVATE when the owner has hidden the vault's or the requested strategy's balances
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /vaults/config:
    get:
      description: Get vaults global configuration.
      tags:
      - Vaults
      summary: Get vaults config
      operationId: vaults-get-config
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.VaultsConfigResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /vaults/history:
    get:
      description: Get PnL and Account value historical timeseries for the given vault.
      tags:
      - Vaults
      summary: Get vault historical data
      operationId: vaults-get-historical-data
      parameters:
      - description: Vault Address
        name: address
        in: query
        required: true
        schema:
          type: string
      - description: Vault Strategy Address
        name: strategy
        in: query
        schema:
          type: string
      - description: Type of data
        name: type
        in: query
        required: true
        schema:
          type: string
          enum:
          - pnl
          - value
          - price
      - description: Resolution of data
        name: resolution
        in: query
        required: true
        schema:
          type: string
          enum:
          - alltime
          - 1h
          - 8h
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.VaultHistoricalDataResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /vaults/mine:
    get:
      security:
      - BearerToken: []
      description: 'Returns all vaults (any status) where the caller is the operator or owner,

        plus the vault the caller is a sub-operator (strategy) of, if any.

        It includes vaults not active yet, like initializing or pending initial deposit.

        Each vault includes its strategies (sub-operators), so the UI can resolve

        valid operator sub-operator transfer counterparties.'
      tags:
      - Vaults
      summary: Get vaults owned, operated, or sub-operated by the authenticated account
      operationId: vaults-get-mine
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.VaultResp'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /vaults/positions:
    get:
      description: Get positions opened by the given vault.
      tags:
      - Vaults
      summary: Get vault positions
      operationId: vaults-get-positions
      parameters:
      - description: Vault Address
        name: address
        in: query
        required: true
        schema:
          type: string
      - description: Vault Strategy Address
        name: strategy
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.PositionResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: VAULT_DATA_PRIVATE when the owner has hidden the vault's or the requested strategy's positions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /vaults/summary:
    get:
      description: Get vaults summary metrics for all vaults or for the single vault specified by address.
      tags:
      - Vaults
      summary: Get vault summary
      operationId: vaults-get-summary
      parameters:
      - description: Vault Address
        name: address
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.VaultSummaryResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /vaults/transfers:
    get:
      description: Get deposits and withdrawals related to the given vault.
      tags:
      - Vaults
      summary: Get vault transfers
      operationId: vaults-get-transfers
      parameters:
      - description: Vault Address
        name: address
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.TransferResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    responses.TransferStatus:
      type: string
      enum:
      - PENDING
      - AVAILABLE
      - COMPLETED
      - FAILED
      x-enum-comments:
        TransferStatusAvailable: 'Action is required from user: For Withdrawals refers to L2 txn status being `ACCEPTED_ON_L1` and funds available for collection on Ethereum bridge. For Deposits refers to funds being available in the L2 account, ready to be deposited to Paraclear contract.'
        TransferStatusCompleted: 'Transfer has completed (final state): For Withdrawals funds have been collected and have moved to the requested Ethereum account; refers to L1 bridge withdraw txn status `SUCCESS`. For Deposits funds have become available in Paradex; refers to the L2 txn status being `ACCEPTED_ON_L2`.'
        TransferStatusFailed: L2 txn calling Paraclear contract failed with `REJECTED` or `REVERTED` status. Deposits can be retried when they fail by repeating the L2 txn.
        TransferStatusPending: 'L2 txn calling Paraclear contract is in flight: For Withdrawals it''s the initial status; refers to the L2 txn status being `RECEIVED`, `PENDING`, `ACCEPTED_ON_L2`. For Deposits refers to L2 txn status being `RECEIVED`, `PENDING`.'
      x-enum-varnames:
      - TransferStatusPending
      - TransferStatusAvailable
      - TransferStatusCompleted
      - TransferStatusFailed
    responses.VaultMonthlyPnlEntry:
      type: object
      properties:
        month:
          type: string
          example: '2026-05-01'
        month_return_pct:
          type: string
          example: '0.0123'
    responses.VaultStatus:
      type: string
      enum:
      - INITIALIZING
      - ACTIVE
      - CLOSED
      - FAILED
      x-enum-varnames:
      - VaultStatusInitializing
      - VaultStatusActive
      - VaultStatusClosed
      - VaultStatusFailed
    responses.VaultAnalytics:
      type: object
      properties:
        address:
          type: string
          example: '0x1234567890abcdef'
        annualized_volatility:
          $ref: '#/components/schemas/responses.WindowedMetrics'
        apr:
          $ref: '#/components/schemas/responses.WindowedMetrics'
        as_of:
          type: string
          example: '2026-05-05 09:00:00.000'
        best_period_return:
          $ref: '#/components/schemas/responses.WindowedMetrics'
        max_drawdown:
          $ref: '#/components/schemas/responses.WindowedMetrics'
        monthly_pnl_last_12m:
          type: array
          items:
            $ref: '#/components/schemas/responses.VaultMonthlyPnlEntry'
        pct_positive:
          $ref: '#/components/schemas/responses.WindowedMetrics'
        pnl:
          $ref: '#/components/schemas/responses.WindowedMetrics'
        recovery_hours:
          $ref: '#/components/schemas/responses.WindowedMetrics'
        sharpe_ratio:
          $ref: '#/components/schemas/responses.WindowedMetrics'
        top_holders:
          type: array
          items:
            $ref: '#/components/schemas/responses.VaultTopHolder'
        worst_period_return:
          $ref: '#/components/schemas/responses.WindowedMetrics'
    responses.VaultTopHolder:
      type: object
      properties:
        percentage:
          type: string
          example: '24.6371578053709186'
        rank:
          type: integer
          example: 1
        value_usdc:
          type: string
          example: '3758808.50501487823'
    responses.AccountMonthlyPnlEntry:
      type: object
      properties:
        month:
          type: string
          example: '2026-05-01'
        month_return_canonical:
          type: string
          example: '0.0123'
    responses.TransferKind:
      type: string
      enum:
      - DEPOSIT
      - WITHDRAWAL
      - UNWINDING
      - VAULT_DEPOSIT
      - VAULT_WITHDRAWAL
      - AUTO_WITHDRAWAL
      - AIRDROP
      x-enum-varnames:
      - TransferKindDeposit
      - TransferKindWithdrawal
      - TransferKindUnwinding
      - TransferKindVaultDeposit
      - TransferKindVaultWithdrawal
      - TransferKindAutoWithdrawal
      - TransferKindAirdrop
    responses.BalanceResp:
      type: object
      properties:
        average_entry_price:
          description: Average entry price
          type: string
          example: '2901.34'
        average_entry_price_usd:
          description: Average entry price in USD
          type: string
          example: '2902.18'
        cost:
          description: Balance cost
          type: string
          example: '105.4623'
        cost_usd:
          description: Balance cost in USD
          type: string
          example: '105.8311'
        last_updated_at:
          description: Balance last updated time
          type: integer
          example: 1681462770114
        size:
          description: Balance amount of settlement token (includes deposits, withdrawals, realized PnL, realized funding, and fees)
          type: string
          example: '123003.620'
        token:
          description: Name of the token
          type: string
          example: USDC
    responses.PositionResp:
      type: object
      properties:
        account:
          description: Account ID of the position
          type: string
        average_entry_price:
          description: Average entry price
          type: string
          example: '29001.34'
        average_entry_price_usd:
          description: Average entry price in USD
          type: string
          example: '29001.34'
        average_exit_price:
          description: Average exit price
          type: string
          example: '29001.34'
        cached_funding_index:
          description: Position cached funding index
          type: string
          example: '1234.3'
        closed_at:
          description: Position closed time
          type: integer
          example: 1681493939981
        cost:
          description: Position cost
          type: string
          example: '-10005.4623'
        cost_usd:
          description: Position cost in USD
          type: string
          example: '-10005.4623'
        created_at:
          description: Position creation time
          type: integer
          example: 1681493939981
        id:
          description: Unique string ID for the position
          type: string
          example: '1234234'
        last_fill_id:
          description: Last fill ID to which the position is referring
          type: string
          example: '1234234'
        last_updated_at:
          description: Position last update time
          type: integer
          example: 1681493939981
        leverage:
          description: Leverage of the position
          type: string
        liquidation_price:
          description: Liquidation price of the position
          type: string
        market:
          description: Market for position
          type: string
          example: BTC-USD-PERP
        realized_positional_funding_pnl:
          description: Realized Funding PnL for the position. Reset to 0 when position is closed or flipped.
          type: string
          example: '12.234'
        realized_positional_pnl:
          description: Realized PnL including both positional PnL and funding payments. Reset to 0 when position is closed or flipped.
          type: string
          example: '-123.23'
        seq_no:
          description: Unique increasing number (non-sequential) that is assigned to this position update. Can be used to deduplicate multiple feeds
          type: integer
          example: 1681471234972000000
        side:
          description: 'Position Side : Long or Short'
          type: string
          enum:
          - SHORT
          - LONG
        size:
          description: Size of the position with sign (positive if long or negative if short)
          type: string
          example: '-0.345'
        status:
          description: 'Status of Position : Open or Closed'
          type: string
          enum:
          - OPEN
          - CLOSED
        unrealized_funding_pnl:
          description: Unrealized running funding P&L for the position
          type: string
          example: '12.234'
        unrealized_pnl:
          description: Unrealized P&L of the position in the quote asset. Includes the unrealized running funding P&L.
          type: string
          example: '-123.23'
    requests.CreateVault:
      type: object
      properties:
        curator_name:
          description: Curator name for the vault (optional)
          type: string
          example: Some Curator
        deposit_tx_signature:
          description: Initial deposit transfer by vault owner
          type: string
          example: '['
        description:
          description: Description for the vault
          type: string
          example: My vault description
        lockup_period:
          description: User's deposits lockup period in days
          type: integer
          example: 1
        max_tvl:
          description: Max TVL locked by the Vault, if any. 0 for unlimited
          type: integer
          example: 1000000
        name:
          description: Unique name for the vault
          type: string
          example: MyVault
        operator_eth_address:
          description: EVM address of the vault operator (empty for legacy Starknet operator)
          type: string
          example: '0x1234567890abcdef1234567890abcdef12345678'
        operator_index:
          description: Index of the operator sub-account (0 for legacy Starknet operator)
          type: integer
          example: 1
        operator_signer_type:
          description: 'Signer type for the operator: "starknet" (default when empty) or "eip191"'
          type: string
          example: eip191
        profit_share:
          description: Vault owner profit share (percentage)
          type: integer
          example: 10
        public_key:
          description: Public key of vault operator
          type: string
          example: '0x1234567890abcdef'
        show_balances:
          description: Whether the vault's balances are publicly visible. Defaults to true when omitted.
          type: boolean
          example: true
        show_positions:
          description: Whether the vault's positions are publicly visible. Defaults to true when omitted.
          type: boolean
          example: true
        strategy_description:
          description: Strategy description for the vault (optional)
          type: string
          example: Delta Neutral
    responses.VaultsConfigResponse:
      type: object
      properties:
        max_lockup_period_days:
          description: Maximum lockup period in days an owner can configure for a vault
          type: string
          example: '4'
        max_profit_share_percentage:
          description: Maximum profit share percentage (0-100) an owner can configure for a vault
          type: string
          example: '50'
        min_initial_deposit:
          description: Minimum initial collateral deposit (in currency units) at vault creation. Only applies to the owner
          type: string
          example: '1000'
        min_lockup_period_days:
          description: Minimum lockup period in days an owner can configure for a vault
          type: string
          example: '1'
        min_owner_share_percentage:
          description: Minimum share percentage (0-100) the vault owner must maintain on the vault
          type: string
          example: '5'
        profit_share_period:
          description: Default interval between vault profit-share fee settlements, in seconds. A vault can carry its own; read profit_share_period on the vault to show its actual schedule. 0 means not configured
          type: string
          example: '2592000'
        vault_factory_address:
          description: Address of the vault factory contract
          type: string
          example: '0x1234567890abcdef'
    responses.ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - BINDING_ERROR
      - INTERNAL_ERROR
      - NOT_FOUND
      - SERVICE_UNAVAILABLE
      - INVALID_REQUEST_PARAMETER
      - ORDER_ID_NOT_FOUND
      - ORDER_IS_CLOSED
      - ORDER_IS_NOT_OPEN
      - INVALID_ORDER_SIZE
      - CLIENT_ORDER_ID_NOT_FOUND
      - DUPLICATED_CLIENT_ID
      - INVALID_SYMBOL
      - INVALID_TOKEN
      - INVALID_ETHEREUM_ADDRESS
      - INVALID_ETHEREUM_SIGNATURE
      - INVALID_STARKNET_ADDRESS
      - INVALID_STARKNET_SIGNATURE
      - STARKNET_SIGNATURE_VERIFICATION_FAILED
      - ETHEREUM_SIGNER_MISMATCH
      - ETHEREUM_HASH_MISMATCH
      - NOT_ONBOARDED
      - INVALID_TIMESTAMP
      - INVALID_BLOCK_EXPIRATION
      - ACCOUNT_NOT_FOUND
      - MEDIA_NOT_FOUND
      - INVALID_ORDER_SIGNATURE
      - PUBLIC_KEY_INVALID
      - UNAUTHORIZED_ETHEREUM_ADDRESS
      - UNAUTHORIZED_ERROR
      - ETHEREUM_ADDRESS_ALREADY_ONBOARDED
      - EVM_ADDRESS_ALREADY_ONBOARDED
      - MARKET_NOT_FOUND
      - ALLOWLIST_ENTRY_NOT_FOUND
      - USERNAME_IN_USE
      - GEO_IP_BLOCK
      - ETHEREUM_ADDRESS_BLOCKED
      - PROGRAM_NOT_FOUND
      - PROGRAM_NOT_SUPPORTED
      - INVALID_DASHBOARD
      - MARKET_NOT_OPEN
      - MARKET_NOT_SETTLED
      - INVALID_REFERRAL_CODE
      - REQUEST_NOT_ALLOWED
      - PARENT_ADDRESS_ALREADY_ONBOARDED
      - INVALID_PARENT_ACCOUNT
      - INVALID_VAULT_OPERATOR_CHAIN
      - VAULT_OPERATOR_ALREADY_ONBOARDED
      - VAULT_NAME_IN_USE
      - VAULT_NOT_FOUND
      - VAULT_STRATEGY_NOT_FOUND
      - VAULT_LIMIT_REACHED
      - VAULT_DATA_PRIVATE
      - BATCH_SIZE_OUT_OF_RANGE
      - ISOLATED_MARKET_ACCOUNT_MISMATCH
      - NO_ACCESS_TO_MARKET
      - POINTS_SUMMARY_NOT_FOUND
      - ALGO_ID_NOT_FOUND
      - INVALID_DERIVATION_PATH
      - PROFILE_STATS_NOT_FOUND
      - INVALID_CHAIN
      - INVALID_LAYERSWAP_SWAP
      - INVALID_DEPOSIT_ADDRESS
      - SOCIAL_USERNAME_IN_USE
      - INVALID_OAUTH_REQUEST
