openapi: 3.2.0
info:
  title: Paradex Algos API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Algos across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Algos
paths:
  /algo/orders:
    get:
      security:
      - BearerToken: []
      description: Get current user all open algo orders
      tags:
      - Algos
      summary: Get open algo orders
      operationId: get-open-algo-orders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.AlgoOrderResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: 'Create a new algo order


        ### TWAP


        TWAP orders break a large trade into smaller ones over time to reduce market impact:

        - Sub-orders are placed every 30 seconds.

        - Order duration is between 30 and 86,400 seconds, in multiples of 30.

        - Supported sub order type: MARKET'
      tags:
      - Algos
      summary: Create algo order
      operationId: create-algo-order
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.AlgoOrderRequest'
        description: Algo order content
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AlgoOrderResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /algo/orders-history:
    get:
      security:
      - BearerToken: []
      description: Get current user algo orders filtered on attributes
      tags:
      - Algos
      summary: Get algo orders history
      operationId: get-algo-orders-history
      parameters:
      - example: client-id
        description: Unique ID of client generating the order
        name: client_id
        in: query
        schema:
          type: string
      - description: Returns the ‘next’ paginated page.
        name: cursor
        in: query
        schema:
          type: string
      - description: End Time (unix time millisecond)
        name: end_at
        in: query
        schema:
          type: integer
      - example: BTC-USD-PERP
        description: Market for the order
        name: market
        in: query
        schema:
          type: string
      - description: Limit the number of responses in the page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - description: Order side
        name: side
        in: query
        schema:
          type: string
          enum:
          - BUY
          - SELL
      - description: Start Time (unix time millisecond)
        name: start_at
        in: query
        schema:
          type: integer
      - description: Order status
        name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
          - NEW
      - description: Order type
        name: type
        in: query
        schema:
          type: string
          enum:
          - LIMIT
          - MARKET
          - STOP_LIMIT
          - STOP_MARKET
          - STOP_LOSS_LIMIT
          - STOP_LOSS_MARKET
          - TAKE_PROFIT_LIMIT
          - TAKE_PROFIT_MARKET
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.AlgoOrderResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /algo/orders/{algo_id}:
    get:
      security:
      - BearerToken: []
      description: Get an algo order by id. Only return algo order in `OPEN` or `NEW` status.
      tags:
      - Algos
      summary: Get algo order by id
      operationId: get-algo-order-by-id
      parameters:
      - description: Algo ID
        name: algo_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.AlgoOrderResp'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    delete:
      security:
      - BearerToken: []
      description: Cancel an existing algo order by id
      tags:
      - Algos
      summary: Cancel algo order by id
      operationId: cancel-algo-order
      parameters:
      - description: Algo ID
        name: algo_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    responses.AlgoOrderResp:
      type: object
      properties:
        account:
          description: Account identifier (user's account address)
          type: string
          example: '0x4638e3041366aa71720be63e32e53e1223316c7f0d56f7aa617542ed1e7512'
        algo_params:
          description: Type-specific algo parameters
          type: object
          additionalProperties:
            type: string
        algo_type:
          description: Algo type
          allOf:
          - $ref: '#/components/schemas/responses.AlgoType'
          example: TWAP
        avg_fill_price:
          description: Average fill price of the order
          type: string
          example: '26000'
        cancel_reason:
          description: Reason for algo cancellation if it was closed by cancel
          type: string
          example: NOT_ENOUGH_MARGIN
        created_at:
          description: Algo creation time
          type: integer
          example: 1681493746016
        end_at:
          description: Algo end time
          type: integer
          example: 1681493746016
        id:
          description: Unique algo identifier
          type: string
          example: '123456'
        last_updated_at:
          description: Algo last update time.  No changes once status=CLOSED
          type: integer
          example: 1681493746016
        market:
          description: Market to which algo belongs
          type: string
          example: BTC-USD-PERP
        remaining_size:
          description: Remaining size of the algo
          type: string
          example: '0'
        side:
          description: Algo side
          allOf:
          - $ref: '#/components/schemas/responses.OrderSide'
        size:
          description: Algo size
          type: string
          example: '0.05'
        status:
          description: Algo status
          allOf:
          - $ref: '#/components/schemas/responses.OrderStatus'
    responses.OrderType:
      type: string
      enum:
      - MARKET
      - LIMIT
      - STOP_LIMIT
      - STOP_MARKET
      - TAKE_PROFIT_LIMIT
      - TAKE_PROFIT_MARKET
      - STOP_LOSS_MARKET
      - STOP_LOSS_LIMIT
      x-enum-varnames:
      - OrderTypeMarket
      - OrderTypeLimit
      - OrderTypeStopLimit
      - OrderTypeStopMarket
      - OrderTypeTakeProfitLimit
      - OrderTypeTakeProfitMarket
      - OrderTypeStopLossMarket
      - OrderTypeStopLossLimit
    responses.PaginatedAPIResults:
      type: object
      properties:
        next:
          description: The pointer to fetch next set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiMsIm1hcmtlciI6eyJtYXJrZXIiOiIxNjc1NjUwMDE3NDMxMTAxNjk5N=
        prev:
          description: The pointer to fetch previous set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiOnsiTGltaXQiOjkwfSwidGltZSI6MTY4MTY3OTgzNzk3MTMwOTk1MywibWFya2VyIjp7Im1zMjExMD==
        results:
          description: Array of paginated results
          type: array
          items:
            type: object
    requests.AlgoOrderRequest:
      type: object
      required:
      - algo_type
      - duration_seconds
      - market
      - side
      - signature
      - signature_timestamp
      - size
      - type
      properties:
        algo_type:
          description: Algo type, required for algo orders creation
          type: string
          example: TWAP
        dime_discount:
          description: If true, child-order fees are charged in DIME with the DIME discount applied; falls back to USDC if balance is insufficient
          type: boolean
        duration_seconds:
          description: Duration in seconds for which the algo order will be running, required for algo orders creation
          type: integer
          example: 3600
        frequency:
          description: 'Interval in seconds between child orders (default: 30)'
          type: integer
          example: 30
        market:
          description: Market for which order is created
          type: string
          example: BTC-USD-PERP
        on_behalf_of_account:
          description: ID corresponding to the configured isolated margin account. Only for isolated margin orders
          type: string
          example: '0x1234567890abcdef'
        recv_window:
          description: Order will be created if it is received by API within RecvWindow milliseconds from signature timestamp, minimum is 10 milliseconds
          type: integer
        side:
          description: Algo order side
          allOf:
          - $ref: '#/components/schemas/responses.OrderSide'
          example: MARKET
        signature:
          description: Order signature in as a string "[r,s]" signed by account's paradex private key
          type: string
        signature_timestamp:
          description: Unix timestamp in milliseconds of order creation, used for signature verification
          type: integer
        size:
          description: Size of the algo order
          type: string
          example: '1.213'
        type:
          description: Algo order type, only MARKET is supported
          allOf:
          - $ref: '#/components/schemas/responses.OrderType'
