openapi: 3.2.0
info:
  title: Paradex Orders API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Orders across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Orders
paths:
  /orders:
    get:
      security:
      - BearerToken: []
      description: Get current user all open orders
      tags:
      - Orders
      summary: Get open orders
      operationId: get-open-orders
      parameters:
      - description: 'Market symbol, ex: BTC-USD-PERP'
        name: market
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.OrderResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: 'Submits a new order to Paradex.


        Returns an order status object with a unique order `id` assigned by Paradex. This

        order `id` serves as the primary identifier for the order.


        The REST API performs basic validation and queues the order for risk checks

        (order `status`=`NEW`).


        Once validation and risk checks are successful, the order is sent to the matching

        engine. The matching engine processes the order and updates the status to `OPEN`

        if the order is resting. If the order is fully filled or cannot be processed, the

        status changes to `CLOSED` and a `cancel_reason` code is provided (e.g., fully

        filled or no liquidity).'
      tags:
      - Orders
      summary: Create order
      operationId: orders-new
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.OrderRequest'
        description: Order content
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.OrderResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    delete:
      security:
      - BearerToken: []
      tags:
      - Orders
      summary: Cancel all open orders
      operationId: orders-cancel-all
      parameters:
      - description: Market to cancel orders for
        name: market
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /orders-history:
    get:
      security:
      - BearerToken: []
      description: Get current user orders filtered on attributes
      tags:
      - Orders
      summary: Get orders
      operationId: get-orders
      parameters:
      - example: client-id
        description: Unique ID of client generating the order
        name: client_id
        in: query
        schema:
          type: string
      - description: Returns the ‘next’ paginated page.
        name: cursor
        in: query
        schema:
          type: string
      - description: End Time (unix time millisecond)
        name: end_at
        in: query
        schema:
          type: integer
      - example: BTC-USD-PERP
        description: Market for the order
        name: market
        in: query
        schema:
          type: string
      - description: Limit the number of responses in the page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      - description: Order side
        name: side
        in: query
        schema:
          type: string
          enum:
          - BUY
          - SELL
      - description: Start Time (unix time millisecond)
        name: start_at
        in: query
        schema:
          type: integer
      - description: Order status
        name: status
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
          - NEW
      - description: Order type
        name: type
        in: query
        schema:
          type: string
          enum:
          - LIMIT
          - MARKET
          - STOP_LIMIT
          - STOP_MARKET
          - STOP_LOSS_LIMIT
          - STOP_LOSS_MARKET
          - TAKE_PROFIT_LIMIT
          - TAKE_PROFIT_MARKET
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.OrderResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /orders/batch:
    post:
      security:
      - BearerToken: []
      description: 'Place a batch of orders


        + Valid batch size is between 1-10 order(s)

        + If basic validation(including signature) fails - all orders will be rejected.

        + Orders are queued for risk checking independently and failure of one order

        doesn''t affect processing of another order.'
      tags:
      - Orders
      summary: Create batch of orders
      operationId: orders-new-batch
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/requests.OrderRequest'
        description: Order content
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.BatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    delete:
      security:
      - BearerToken: []
      description: 'Queues cancellation for multiple orders by providing identifiers in a batch.


        The request body can contain either or both of:

        - `order_ids`: Array of order IDs assigned by Paradex

        - `client_order_ids`: Array of client-assigned order IDs


        ```json

        {

        "order_ids": ["order-id-1", "order-id-2"],

        "client_order_ids": ["client-id-1", "client-id-2"]

        }

        ```


        Returns a 200 OK status code with detailed results for each order:


        ```json

        {

        "results": [

        {

        "id": "order-id-1",

        "client_id": "client-id-X",

        "account": "account-1",

        "market": "BTC-USD-PERP",

        "status": "QUEUED_FOR_CANCELLATION"

        },

        {

        "id": "order-id-2",

        "client_id": "client-id-Y",

        "account": "account-1",

        "market": "ETH-USD-PERP",

        "status": "ALREADY_CLOSED"

        },

        {

        "id": "order-id-3",

        "client_id": "client-id-1",

        "account": "account-1",

        "market": "BTC-USD-PERP",

        "status": "QUEUED_FOR_CANCELLATION"

        },

        {

        "client_id": "client-id-2",

        "status": "NOT_FOUND"

        }

        ]

        }

        ```


        Each result includes:

        - `id`: Order ID (if the order was found)

        - `client_id`: Client order ID (if available)

        - `account`: Account that owns the order

        - `market`: Market of the order

        - `status`: One of:

        + `QUEUED_FOR_CANCELLATION`: Order was successfully queued for cancellation

        + `ALREADY_CLOSED`: Order was already in a closed state

        + `NOT_FOUND`: The order with the provided ID/client ID was not found


        Confirmation of cancellation will be sent via websocket or can be verified from

        GET /orders/:id endpoint.


        Orders that are already in a CLOSED state will be included in the response with

        status "ALREADY_CLOSED".'
      tags:
      - Orders
      summary: Cancel batch of orders by order IDs
      operationId: orders-cancel-batch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.CancelOrderBatchRequest'
        description: Order IDs to cancel
        required: true
      responses:
        '200':
          description: List of cancellation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.CancelOrderBatchResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /orders/by_client_id/{client_id}:
    get:
      security:
      - BearerToken: []
      description: Get an order by client id. Only returns orders in `OPEN` status.
      tags:
      - Orders
      summary: Get order by client id
      operationId: orders-get-by-client-id
      parameters:
      - description: Client Order Id
        name: client_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.OrderResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    delete:
      security:
      - BearerToken: []
      tags:
      - Orders
      summary: Cancel open order by client order id
      operationId: orders-cancel-by-client-id
      parameters:
      - description: Client Order Id
        name: client_id
        in: path
        required: true
        schema:
          type: string
      - description: Market to cancel orders for
        name: market
        in: query
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /orders/{order_id}:
    get:
      security:
      - BearerToken: []
      description: Get an order by id. Only return orders in `OPEN` or `NEW` status.
      tags:
      - Orders
      summary: Get order
      operationId: orders-get
      parameters:
      - description: Order Id
        name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.OrderResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    put:
      security:
      - BearerToken: []
      description: 'Modify an existing open limit order or TPSL order by changing its

        `price`, `size`, and/or `trigger_price`.


        For untriggered TPSL orders, you can modify `trigger_price`,

        `price` (limit orders only), and `size`.

        Once a TPSL limit order triggers you can modify its `price` and `size`

        just like a regular limit order,

        but the `trigger_price` is no longer modifiable.


        TPSL market orders execute immediately when triggered and

        cannot be modified afterwards.


        The modified order maintains its original order ID.'
      tags:
      - Orders
      summary: Modify order
      operationId: orders-modify
      parameters:
      - description: Order Id
        name: order_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.ModifyOrderRequest'
        description: Modify Order Request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.OrderResp'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    delete:
      security:
      - BearerToken: []
      description: 'Queues a cancellation for a specific order identified by its order ID (assigned by

        Paradex).


        Returns a 204 No Content status code with no response body which means the order

        has been queued for cancellation.


        Confirmation of cancellation will be sent via websocket or can be retried from

        GET /orders/:id endpoint.


        Orders that are already in a CLOSED state cannot be canceled.'
      tags:
      - Orders
      summary: Cancel order
      operationId: orders-cancel
      parameters:
      - description: Order Id
        name: order_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    responses.STPMode:
      type: string
      enum:
      - EXPIRE_MAKER
      - EXPIRE_TAKER
      - EXPIRE_BOTH
      x-enum-comments:
        STPModeExpireBoth: Expire both maker and taker orders if self cross
        STPModeExpireMaker: Expire maker orders if self cross
        STPModeExpireTaker: Expire taker orders if self cross
      x-enum-varnames:
      - STPModeExpireMaker
      - STPModeExpireTaker
      - STPModeExpireBoth
    responses.RequestInfo:
      type: object
      properties:
        id:
          description: Request id
          type: string
        message:
          description: Error message for failed requests
          type: string
        request_type:
          description: Type of request (MODIFY_ORDER)
          type: string
        status:
          description: Status of modify order request
          type: string
    requests.OrderRequest:
      type: object
      required:
      - instruction
      - market
      - price
      - side
      - signature
      - signature_timestamp
      - size
      - type
      properties:
        client_id:
          description: Unique client assigned ID for the order
          type: string
          maxLength: 64
          example: '123454321'
        dime_discount:
          description: If true, fees are charged in DIME with the DIME discount applied; falls back to USDC if balance is insufficient
          type: boolean
        flags:
          description: 'Order flags: REDUCE_ONLY, MMP. MMP is for LIMIT orders on dated options and perpetual futures; only resting maker fills count'
          type: array
          items:
            $ref: '#/components/schemas/responses.OrderFlag'
        instruction:
          description: Order Instruction, GTC, IOC, RPI or POST_ONLY if empty GTC
          allOf:
          - $ref: '#/components/schemas/responses.OrderInstruction'
        market:
          description: Market for which order is created
          type: string
          example: BTC-USD-PERP
        on_behalf_of_account:
          description: ID corresponding to the configured isolated margin account. Only for isolated margin orders
          type: string
          example: '0x1234567890abcdef'
        price:
          description: Order price
          type: string
          example: '29500.12'
        recv_window:
          description: Order will be created if it is received by API within RecvWindow milliseconds from signature timestamp, minimum is 10 milliseconds
          type: integer
        side:
          description: Order side
          allOf:
          - $ref: '#/components/schemas/responses.OrderSide'
        signature:
          description: Order signature in as a string "[r,s]" signed by account's paradex private key
          type: string
        signature_timestamp:
          description: Unix timestamp in milliseconds of order creation, used for signature verification
          type: integer
        size:
          description: Size of the order
          type: string
          example: '1.213'
        stp:
          description: Self Trade Prevention, EXPIRE_MAKER, EXPIRE_TAKER or EXPIRE_BOTH, if empty EXPIRE_TAKER
          type: string
        trigger_price:
          description: Trigger price for stop order
          type: string
        type:
          description: Order type
          allOf:
          - $ref: '#/components/schemas/responses.OrderType'
        vwap_price:
          description: Optional VWAP price for market orders used for VWAP instruction, bounded by price band
          type: string
    responses.OrderInstruction:
      type: string
      enum:
      - GTC
      - POST_ONLY
      - IOC
      - RPI
      x-enum-varnames:
      - OrderInstructionGTC
      - OrderInstructionPostOnly
      - OrderInstructionIOC
      - OrderInstructionRPI
    responses.PaginatedAPIResults:
      type: object
      properties:
        next:
          description: The pointer to fetch next set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiMsIm1hcmtlciI6eyJtYXJrZXIiOiIxNjc1NjUwMDE3NDMxMTAxNjk5N=
        prev:
          description: The pointer to fetch previous set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiOnsiTGltaXQiOjkwfSwidGltZSI6MTY4MTY3OTgzNzk3MTMwOTk1MywibWFya2VyIjp7Im1zMjExMD==
        results:
          description: Array of paginated results
          type: array
          items:
            type: object
    responses.ErrorCode:
      type: string
      enum:
      - VALIDATION_ERROR
      - BINDING_ERROR
      - INTERNAL_ERROR
      - NOT_FOUND
      - SERVICE_UNAVAILABLE
      - INVALID_REQUEST_PARAMETER
