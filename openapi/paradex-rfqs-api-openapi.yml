    requests.RfqLeg:
      type: object
      required:
      - market
      - ratio
      - side
      properties:
        market:
          description: Paradex market symbol
          type: string
          example: BTC-USD-PERP
        price:
          description: Any positive value marks a hedge leg; the leg is then fixed at the market's mark price at creation
          type: string
          example: '30000.00'
        ratio:
          description: Positive decimal multiplier for the leg
          type: string
          example: '1'
        side:
          description: Leg direction
          type: string
          enum:
          - BUY
          - SELL
          example: BUY
    responses.RfqMarketsResult:
      type: object
      properties:
        markets:
          description: 'Deprecated: use MarketsInfo, which carries the same symbols plus the

            venue parameters. Kept until every client reads the structured list.'
          type: array
          items:
            type: string
          example:
          - BTC-USD-PERP
          - ETH-USD-PERP
        markets_info:
          description: One record per market, same markets as Markets and in the same order.
          type: array
          items:
            $ref: '#/components/schemas/responses.RfqMarketInfo'
    requests.RfqCreateRequest:
      type: object
      required:
      - legs
      - quantity
      properties:
        counterparties:
          description: Reserved for future use; currently ignored for RFQ creation and drafts
          type: array
          items:
            type: string
        is_anonymous:
          description: Whether to hide the taker desk name from RFQ counterparties; ignored for drafts
          type: boolean
          example: true
        label:
          description: User-defined RFQ label; ignored for drafts
          type: string
          example: my-rfq
        legs:
          description: Strategy and optional fixed-price hedge legs; maximum 25
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/requests.RfqLeg'
        max_slippage:
          description: 'MaxSlippage sets the collateral held against this RFQ while it is open, as

            a fraction of underlying spot, replacing the configured bound for this RFQ

            only. It does not limit the price the RFQ may execute at. Empty leaves the

            configured one in place. Ignored for drafts.'
          type: string
          example: '0.002'
        quantity:
          description: Positive total strategy size
          type: string
          example: '100'
        side:
          description: 'Side commits the RFQ to one direction of the strategy, which is then the

            only direction it may be executed in. Empty leaves it two-way. Ignored for

            drafts.'
          type: string
          enum:
          - BUY
          - SELL
          example: BUY
        strategy:
          description: Draft strategy label; maximum 64 bytes and defaults to custom for drafts; ignored on RFQ create
          type: string
          example: straddle
    responses.APIResults:
      type: object
      properties:
        results:
          description: Array of results
          type: array
          items:
            type: object
    responses.RfqLegResult:
      type: object
      properties:
        market:
          description: Paradex market symbol
          type: string
          example: BTC-USD-PERP
        price:
          description: Hedge legs only
          type: string
          example: '50000'
        ratio:
          type: string
          example: '1'
        side:
          type: string
          enum:
          - BUY
          - SELL
    requests.RfqExecuteRequest:
      type: object
      required:
      - price
      - quantity
      - side
      properties:
        label:
          description: User-defined order label
          type: string
          example: my-order
        price:
          description: Signed decimal strategy price; zero and negative values are valid
          type: string
          example: '0.1'
        quantity:
          description: Positive decimal strategy quantity
          type: string
          example: '0.1'
        side:
          description: Taker order side
          type: string
          enum:
          - BUY
          - SELL
          example: BUY
    responses.RfqMarketInfo:
      type: object
      properties:
        symbol:
          type: string
          example: BTC-USD-PERP
        venue_size_increment:
          description: 'The venue''s own size grid, as a decimal string. RFQ quantities are

            validated against THIS, not the Paradex market''s own increment, so a

            client sizing off the order-book grid alone can produce a quantity the

            venue rejects. Empty when the venue reports no usable grid for the

            market, which the client reads as "unknown" and falls back on; the

            venue itself remains the authority on whether a quantity is on-grid.'
          type: string
          example: '0.0001'
    responses.RfqBboResult:
      type: object
      properties:
        best_ask_price:
          type: string
          example: '50001'
        best_ask_quantity:
          type: string
          example: '5'
        best_bid_price:
          type: string
          example: '49999'
        best_bid_quantity:
          type: string
          example: '10'
        created_at:
          description: Unix milliseconds
          type: integer
          example: 1640995200000
        legs:
          type: array
          items:
            $ref: '#/components/schemas/responses.RfqBboLegResult'
        mark_price:
          type: string
          example: '50000'
