openapi: 3.2.0
info:
  title: Paradex Rfqs API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged Rfqs across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: Rfqs
paths:
  /account/paradigm/enable:
    post:
      security:
      - BearerToken: []
      description: 'Enables RFQ access for the authenticated account.


        Call this operation once before using the RFQ API. It has no request body and

        only initializes the account associated with the Bearer token. The operation

        is idempotent, so calling it again safely returns the current enabled state.


        Enabling an account for the first time requires a Bearer token issued to the

        account''s main key; a token obtained with a subkey is rejected with `403`.

        Once RFQ access is enabled, any token for the account, including a subkey

        token, receives the current enabled state.


        A successful response has status `ENABLED` and identifies the account and

        delegated RFQ trading public key. If that delegated key was revoked on the

        account, RFQ access is disabled until the operation is called again with a

        main-key token: that call issues a new delegated key, leaves the revoked one

        revoked, and returns the new public key. A subkey token is rejected with `403`

        until then. If the new key it would enable is itself already revoked, the

        operation returns `409` with error `SUBKEY_REVOKED` and RFQ access stays

        disabled.


        The delegated key counts toward the account''s subkey limit. If the account

        already holds the maximum number of subkeys when a new delegated key is

        needed, the operation returns `400` with error `TOKEN_LIMIT_REACHED`, the

        same error as subkey registration, and RFQ access stays disabled. Revoke a

        subkey, then call the operation again with a main-key token.


        If the RFQ venue refuses to enable the account, the operation returns `400`

        with error `REQUEST_NOT_ALLOWED` and the venue''s reason as the message, and

        RFQ access stays disabled. Calling the operation again does not change that

        outcome.'
      tags:
      - Rfqs
      summary: Enable RFQ access
      operationId: rfq-enable
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ParadigmEnableResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /rfqs:
    get:
      security:
      - BearerToken: []
      description: 'Lists the authenticated account''s RFQs, most recent first.


        This is a synchronous read from the RFQ venue. It returns one page of RFQs

        (up to 100 by default, sized via `page_size`), optionally filtered by `state`.

        The page is built from the RFQs the venue holds for the account and every

        account sharing its RFQ registration, of which only the authenticated

        account''s are returned — a busy set of related accounts can therefore leave a

        page short. The response''s `next` field carries the venue''s cursor to the

        following page; pass it back as `cursor` to continue, and stop only when it

        is null — an empty `results` with a non-null `next` is normal, since the

        cursor tracks the venue''s page, not this account''s records. Each

        result includes the venue-issued RFQ identifier, lifecycle state, quantity,

        legs, counterparties, timestamps, and optional close reason. Venue state and

        close-reason strings are passed through. `mark_price`, when present, is the

        venue''s structure mark at the moment the RFQ was created — the reference the

        taker was quoted against — recorded by Paradex at create. It is omitted when

        unknown: an RFQ created before that recording began, a structure the venue

        had not priced at create, or a mark past its retention.'
      tags:
      - Rfqs
      summary: List RFQs
      operationId: rfq-list
      parameters:
      - description: RFQ state to filter by; omit for all states
        name: state
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
      - description: Cursor from a prior response's next field; omit for the first (most recent) page
        name: cursor
        in: query
        schema:
          type: string
      - description: Records per page, between 1 and 1000; omit for the default of 100
        name: page_size
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RfqResults'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: Creates an RFQ for the authenticated account.
      tags:
      - Rfqs
      summary: Create RFQ
      operationId: rfq-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.RfqCreateRequest'
        description: RFQ create request
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RfqAcceptedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /rfqs/drafts:
    get:
      security:
      - BearerToken: []
      description: 'Lists the authenticated account''s stored RFQ drafts, most recent first.


        The response is unpaginated because each account may store at most 20 drafts.

        Drafts are private to the account and have no effect on venue RFQs until their

        contents are submitted through `POST /v1/rfqs`.'
      tags:
      - Rfqs
      summary: List RFQ drafts
      operationId: rfq-draft-list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.APIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.RfqDraftResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    post:
      security:
      - BearerToken: []
      description: 'Stores an RFQ-builder draft for the authenticated account.


        A draft is inert: it is not sent to the RFQ venue and does not reserve margin.

        Each account may store at most 20 drafts. The request shares the RFQ-create

        schema, but only `quantity`, `strategy`, and `legs` are persisted;

        `is_anonymous`, `counterparties`, and `label` are ignored.


        Draft validation permits work in progress. A draft accepts up to 25 legs.

        Quantity and ratios must be positive decimal strings, every market must exist

        on Paradex, `side` must be `BUY` or `SELL`, and a supplied hedge-leg price must

        be positive. `strategy` is limited to 64 bytes and defaults to `custom` when

        omitted. The cross-leg strategy rules enforced by RFQ creation do not apply

        until the draft is submitted through `POST /v1/rfqs`.'
      tags:
      - Rfqs
      summary: Create RFQ draft
      operationId: rfq-draft-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.RfqCreateRequest'
        description: RFQ draft create request (single common input with POST /rfqs; is_anonymous, counterparties and label are ignored for drafts)
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RfqDraftResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /rfqs/drafts/{draft_id}:
    delete:
      security:
      - BearerToken: []
      description: 'Deletes one stored RFQ draft owned by the authenticated account.


        Deleting a draft has no effect on any RFQ previously created from its

        contents. An unknown draft identifier, including an identifier owned by a

        different account, returns `404 Not Found`.'
      tags:
      - Rfqs
      summary: Delete RFQ draft
      operationId: rfq-draft-delete
      parameters:
      - description: Draft id
        name: draft_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /rfqs/markets:
    get:
      security:
      - BearerToken: []
      description: 'Returns the market symbols currently available for RFQ.


        Not every listed Paradex market can be quoted as an RFQ: the venue quotes only

        the instruments it lists for the Paradex venue, and a create naming any other

        market is rejected with a validation error. This endpoint is that set, so a

        client can stop offering markets a create would reject on their name instead of

        discovering the difference after the user has already sized a structure.


        Membership is necessary but not sufficient. A create additionally checks that a

        hedge leg''s price sits on the instrument''s tick and that the strategy quantity

        meets its minimum block size, so a market listed here can still be rejected on

        those grounds.


        `markets_info` carries one record per market: its `symbol` and the venue''s

        own `venue_size_increment`, the step the RFQ quantity must be a multiple of,

        so a client can size on the right grid as the user types. On an RFQ whose legs

        span products, each leg''s size (the quantity times its ratio) is held to its

        own `venue_size_increment`, not to the coarsest step across the RFQ. These

        are the venue instrument''s grids, not the Paradex market''s own increments:

        the two differ, and quantities are validated against the venue''s.

        A quantity has to satisfy both grids, so combine them with their least

        common multiple rather than by taking the larger: the two coincide only when

        one divides the other, which holds for the powers of ten Paradex lists today

        but is not guaranteed of venue data. Neither grid is reliably the coarser

        one. Where they are coprime the combined step can exceed both (0.001 and

        0.0025 give 0.005), which is correct: a quantity off either grid is

        rejected by one side or the other.


        The combined step and the minimum block size constrain different things and

        both always apply, so neither overrides the other. The step says which

        quantities are legal, the block size sets a floor, and the smallest quotable

        size is simply the first step at or above that floor. There is always one, so

        the two can never be mutually unsatisfiable.


        `venue_size_increment` is empty when the venue reports no usable grid for

        that market, or while an older service is still deployed. Read an empty one

        as "unknown" and do not fall back to the market''s own increment alone, since

        a size legal on the order book can still be rejected by the venue.

        `POST /rfqs` validates the quantity against the venue grid and rejects an

        off-grid size before the RFQ is created, so that check remains the authority

        whatever a client sizes on.


        `markets` repeats the same symbols in the same order and is **deprecated**:

        it stays only until every client reads `markets_info`, and new integrations

        should ignore it.


        The set is served from a periodically refreshed snapshot, so a market listed by

        the venue moments ago may take up to one refresh interval to appear here.


        `markets` is never an empty list: a caller cannot tell "the venue quotes

        nothing" from "this read is unavailable", so a degraded or empty snapshot is

        reported as `503` instead. (`venue_size_increments` may legitimately be

        `{}` — an older service reports no grids at all.) Treat any failure as

        "unknown" and fall back to offering every market — the create remains

        authoritative.'
      tags:
      - Rfqs
      summary: List markets available for RFQ
      operationId: rfq-markets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RfqMarketsResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /rfqs/platform-state:
    get:
      security:
      - BearerToken: []
      description: 'Returns whether the RFQ venue currently accepts RFQs from Paradex.


        `state` is the one to act on. It is the more restrictive of two venue states,

        both also returned:


        - `platform_state`, the venue''s global state, with the scheduled next state

        in `next_platform_state` taking effect at `next_platform_state_at` (unix

        milliseconds, `0` when the state is unknown);

        - `venue_state`, the venue''s maintenance state for Paradex markets.


        | `state` | Create | Execute | Cancel |

        | ------- | ------ | ------- | ------ |

        | `AVAILABLE` | yes | yes | yes |

        | `AVAILABLE_CANCEL_ONLY` | no | no | yes |

        | `UNAVAILABLE` | no | no | only when `platform_state` is not `UNAVAILABLE` |

        | `UNKNOWN` | sent to the venue | sent to the venue | sent to the venue |


        A create or an execute refused on the state is answered `400` with error

        `RFQ_VENUE_UNAVAILABLE`. A cancel is always sent to the venue; while

        `platform_state` is `UNAVAILABLE` the venue refuses it, and the WebSocket

        `RESULT` event reports the refusal. `UNKNOWN` means the state could not be

        read recently; requests are then sent to the venue, which answers them through

        the WebSocket `RESULT` event.


        The state is served from a snapshot refreshed every few seconds, so a change

        on the venue appears here after up to one refresh.'
      tags:
      - Rfqs
      summary: Get RFQ venue state
      operationId: rfq-platform-state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RfqPlatformStateResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /rfqs/{rfq_id}:
    delete:
      security:
      - BearerToken: []
      description: 'Queues cancellation of an RFQ.


        Cancellation is asynchronous. Subscribe to the private WebSocket channel

        `rfq` before sending the request. A `202 Accepted` response contains a Paradex

        `request_id` and confirms only that the command was queued. The later

        WebSocket `RESULT` event with the same `request_id` reports whether the venue

        accepted the cancellation. RFQ lifecycle events report the eventual closed

        state.


        The `rfq_id` is the venue-issued identifier returned by a successful create

        result or by the RFQ list endpoint.


        An account holds only one two-way RFQ open at a time, and a bounded number of

        RFQs in total, so this is also the request that frees it to create the next

        one. The `RESULT` event reporting the cancellation accepted is the point at

        which it is normally free; a create sent immediately after may still be

        rejected for the RFQ being open, and can be retried.'
      tags:
      - Rfqs
      summary: Delete RFQ
      operationId: rfq-delete
      parameters:
      - description: Paradigm-issued RFQ id
        name: rfq_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RfqAcceptedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /rfqs/{rfq_id}/bbo:
    get:
      security:
      - BearerToken: []
      description: 'Returns live strategy-level and per-leg market data for one RFQ.


        The response contains the best bid and ask, available quantities, mark price,

        acceptable price band, and per-leg market data. Decimal values are encoded as

        strings. Implied-volatility fields are populated for option legs when supplied

        by the venue.


        The RFQ must be visible to the authenticated account and currently available

        from the venue. Unknown, closed, or inaccessible RFQs return `404 Not Found`.'
      tags:
      - Rfqs
      summary: Get RFQ market data
      operationId: rfq-bbo
      parameters:
      - description: Paradigm-issued RFQ id
        name: rfq_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RfqBboResult'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /rfqs/{rfq_id}/execute:
    post:
      security:
      - BearerToken: []
      description: 'Queues a taker limit Fill-or-Kill order against an RFQ.


        Execution is asynchronous. Subscribe to the private WebSocket channel `rfq`

        before sending the request. A `202 Accepted` response contains a Paradex

        `request_id` and confirms only that the command was queued. The later

        WebSocket `RESULT` event with the same `request_id` reports success or failure;

        on success, `result.order_id` is the venue-issued order identifier.


        `quantity` must be a positive decimal string. `side` is `BUY` or `SELL`.

        `price` is the signed net strategy price, so zero and negative values are valid

        for multi-leg credit strategies.


        `side` must be a direction the RFQ was accepted for, which its create result

        reports as `result.allowed_side`: the direction an RFQ created with a `side` was

        committed to, or either direction for a `TWO_WAY` one. An execute on any other

        side is rejected by the `RESULT` event, because the collateral held against the

        RFQ never covered it. An empty `result.allowed_side` is an RFQ Paradex did not

        risk-check, which holds no such collateral and accepts either direction.


        Validation or risk-check failures that occur after queueing are reported by

        the WebSocket `RESULT` event.


        While the RFQ venue is `AVAILABLE_CANCEL_ONLY` or `UNAVAILABLE` for Paradex,

        the request is rejected with `400` and error `RFQ_VENUE_UNAVAILABLE`. The

        current state is readable at `GET /rfqs/platform-state`.'
      tags:
      - Rfqs
      summary: Execute RFQ
      operationId: rfq-execute
      parameters:
      - description: Paradigm-issued RFQ id
        name: rfq_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.RfqExecuteRequest'
        description: Order details
        required: true
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.RfqAcceptedResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    responses.RfqResults:
      type: object
      properties:
        next:
          description: 'Venue cursor to fetch the next page; null on the venue''s last page.

            An empty `results` with a non-null `next` is normal — the venue

            paginates over the whole RFQ registration, of which only this

            account''s records are returned — so continue until `next` is null

            rather than stopping on an empty page.'
          type: string
          example: cD0yMDIyLTAxLTAxKzAwJTNBMDA=
        results:
          type: array
          items:
            $ref: '#/components/schemas/responses.RfqResult'
    responses.RfqResult:
      type: object
      properties:
        closed_reason:
          description: Empty while open
          type: string
          example: EXPIRED
        counterparties:
          description: Maker desk tickers the RFQ was sent to
          type: array
          items:
            type: string
        created_at:
          description: Unix milliseconds
          type: integer
          example: 1640995200000
        expires_at:
          type: integer
          example: 1640995500000
        id:
          description: Venue-issued RFQ id
          type: string
          example: r_2abCdEfGhIjKlMnOpQrStUvWxYz
        label:
          description: User label
          type: string
        legs:
          type: array
          items:
            $ref: '#/components/schemas/responses.RfqLegResult'
        mark_price:
          description: 'The venue''s structure mark when the RFQ was created — per unit, signed

            as listed — the reference the taker was quoted against. Omitted when

            unknown: an RFQ created before marks were recorded, a structure the

            venue had not priced at create, or a mark past its retention.'
          type: string
          example: '49.98'
        quantity:
          description: Total strategy size
          type: string
          example: '10'
        state:
          type: string
          enum:
          - OPEN
          - CLOSED
    responses.ParadigmEnableResponse:
      type: object
      properties:
        account:
          description: Paradex account enabled for RFQ access
          type: string
        status:
          description: Current RFQ enablement status
          type: string
          enum:
          - ENABLED
        subkey_public_key:
          description: Public key used for delegated RFQ trading, when available
          type: string
    responses.RfqBboLegResult:
      type: object
      properties:
        best_ask_iv:
          description: Options legs only
          type: string
          example: '0.56'
        best_ask_price:
          type: string
          example: '50001'
        best_ask_quantity:
          type: string
          example: '5'
        best_bid_iv:
          description: Options legs only
          type: string
          example: '0.55'
        best_bid_price:
          type: string
          example: '49999'
        best_bid_quantity:
          type: string
