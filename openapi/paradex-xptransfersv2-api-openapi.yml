openapi: 3.2.0
info:
  title: Paradex XP Transfers V2 API
  version: 1.142.2
  contact: {}
  description: 'Operations tagged XPTransfersV2 across 2 of this provider''s published API definitions: paradex-openapi-prod.json, paradex-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.prod.paradex.trade/v1
tags:
- name: XPTransfersV2
paths:
  /xp/account-balance:
    get:
      security:
      - BearerToken: []
      description: 'Get detailed XP balance including earned XP, transfer delta, and transferrable

        amount.'
      tags:
      - XPTransfersV2
      summary: Get XP Balance (V2)
      operationId: get-xp-balance-v2
      parameters:
      - description: Season filter ('preseason' for Preseason, 'season1' for Season 1, 'season2' for Season 2, 'season3' for Season 3)
        name: season
        in: query
        schema:
          type: string
          default: season3
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.GetXPBalanceResponseV2'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /xp/fee-config:
    get:
      description: Get the current fee percentage charged on XP transfers
      tags:
      - XPTransfersV2
      summary: Get Transfer Fee Configuration
      operationId: get-transfer-fee-config-v2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/services.TransferFeeConfigResponse'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /xp/public-transfers:
    get:
      description: Retrieve a feed of public XP transfers. Supports filtering by time range or getting the latest transfers based on page_size. Private transfers are excluded from results.
      tags:
      - XPTransfersV2
      summary: Get Public XP Transfer History
      operationId: get-public-xp-transfers-v2
      parameters:
      - description: Start timestamp in milliseconds
        name: start_at
        in: query
        schema:
          type: integer
      - description: End timestamp in milliseconds
        name: end_at
        in: query
        schema:
          type: integer
      - description: Season filter ('preseason' for Preseason, 'season1' for Season 1, 'season2' for Season 2, 'season3' for Season 3)
        name: season
        in: query
        schema:
          type: string
          default: season3
      - description: Pagination cursor
        name: cursor
        in: query
        schema:
          type: string
      - description: Number of results per page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.XPTransfer'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /xp/transfer:
    post:
      security:
      - BearerToken: []
      description: Transfer XP instantly from your account to another user.
      tags:
      - XPTransfersV2
      summary: Create XP Transfer
      operationId: create-xp-transfer-v2
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/requests.CreateXPTransferRequest'
        description: Transfer details
        required: true
      responses:
        '201':
          description: Transfer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.CreateTransferResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '403':
          description: Not whitelisted for XP transfers V2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /xp/transfer/{transfer_id}:
    get:
      description: 'Retrieve details of a specific XP transfer by its ID. This is a public endpoint that does not require authentication. Note: Private transfers will return 404 (not found) to maintain privacy.'
      tags:
      - XPTransfersV2
      summary: Get XP Transfer by ID
      operationId: get-xp-transfer-by-id-v2
      parameters:
      - description: Transfer ID
        name: transfer_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.XPTransfer'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
  /xp/transfers:
    get:
      security:
      - BearerToken: []
      description: 'Retrieve XP transfer history for the authenticated account with optional

        filtering by role (sender/recipient).'
      tags:
      - XPTransfersV2
      summary: Get XP Transfer History
      operationId: get-xp-transfers-v2
      parameters:
      - description: Filter by role
        name: role
        in: query
        schema:
          type: string
          enum:
          - sender
          - recipient
      - description: Season filter ('preseason' for Preseason, 'season1' for Season 1, 'season2' for Season 2, 'season3' for Season 3)
        name: season
        in: query
        schema:
          type: string
          default: season3
      - description: Pagination cursor
        name: cursor
        in: query
        schema:
          type: string
      - description: Number of results per page
        name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 5000
          default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/responses.PaginatedAPIResults'
                - type: object
                  properties:
                    results:
                      type: array
                      items:
                        $ref: '#/components/schemas/responses.XPTransfer'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/responses.ApiError'
    servers:
    - url: https://api.prod.paradex.trade/v1
components:
  schemas:
    requests.CreateXPTransferRequest:
      type: object
      required:
      - amount
      - recipient
      properties:
        amount:
          description: Amount of XP to transfer (must be >= 1 and <= 1e12)
          type: integer
          maximum: 1000000000000
          minimum: 1
          example: 100
        is_private:
          description: Whether the transfer is private (not shown on public feeds). Defaults to false if not provided.
          type: boolean
          default: false
          example: false
        recipient:
          description: Recipient's Starknet address (hex format)
          type: string
          example: '0x1234567890abcdef0123456789abcdef'
        season:
          description: Season identifier. Defaults to season3 if not provided. Only season3 XP can be transferred.
          type: string
          default: season3
          example: season3
    services.TransferFeeConfigResponse:
      type: object
      properties:
        fee_percentage:
          description: Fee percentage charged on transfers (e.g., 0.01 = 1%)
          type: number
    responses.CreateTransferResponse:
      type: object
      properties:
        transfer:
          description: The created XP transfer
          allOf:
          - $ref: '#/components/schemas/responses.XPTransfer'
    responses.PaginatedAPIResults:
      type: object
      properties:
        next:
          description: The pointer to fetch next set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiMsIm1hcmtlciI6eyJtYXJrZXIiOiIxNjc1NjUwMDE3NDMxMTAxNjk5N=
        prev:
          description: The pointer to fetch previous set of records (null if there are no records left)
          type: string
          example: eyJmaWx0ZXIiOnsiTGltaXQiOjkwfSwidGltZSI6MTY4MTY3OTgzNzk3MTMwOTk1MywibWFya2VyIjp7Im1zMjExMD==
        results:
          description: Array of paginated results
          type: array
          items:
            type: object
