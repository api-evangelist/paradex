          type: integer
          example: 1000
        transferrable_xp:
          description: Maximum XP that can be transferred
          type: integer
          example: 700
        xp_delta:
          description: Net XP from transfers
          type: integer
          example: 200
  securitySchemes:
    BearerToken:
      type: apiKey
      name: Authorization
      in: header
