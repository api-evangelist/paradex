    responses.XPTransfer:
      type: object
      properties:
        amount:
          description: Amount of XP transferred
          type: integer
          example: 100
        created_at:
          description: Creation timestamp (milliseconds since epoch)
          type: integer
          example: 1640995200000
        fee:
          description: Fee charged for the transfer (deducted from sender's balance)
          type: integer
          example: 1
        id:
          description: Unique transfer identifier
          type: string
          example: transfer_123
        is_private:
          description: Whether the transfer is private (not shown on public feeds)
          type: boolean
          example: false
        recipient:
          description: Address of the recipient (gaining XP)
          type: string
          example: '0xfedcba0987654321'
        season:
          description: Season identifier ('season1' for Season 1, 'season2' for Season 2, etc.)
          type: string
          example: season2
        sender:
          description: Address of the sender (losing XP)
          type: string
          example: '0x1234567890abcdef'
    responses.ApiError:
      type: object
      properties:
        data:
          description: any additional data related to the error
          type: object
        error:
          description: unique immutable string identifier for specific error
          allOf:
          - $ref: '#/components/schemas/responses.ErrorCode'
          example: NOT_ONBOARDED
        message:
